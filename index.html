      { label: '负载功率', text: () => `${num(r.Pload)} mW`, unit: '' },
      { label: 'RC 上功耗', text: () => `${num(r.Prc)} mW`, unit: '' }
    ]
  }],
  notes: (v, r) => {
    const n = [];
    if (v.VCC < v.Vload + v.VCEsat) n.push({ l: 'err', t: 'VCC 必须大于 负载电压 + VCE(sat)，否则三极管无法饱和导通。' });
    if (!r.feasible) n.push({ l: 'warn', t: 'RB 区间不成立，检查控制电平是否低于 Ube，或负载电流过大。' });
    else n.push({ l: 'ok', t: `RB 可在 ${num(r.RBmin)} ~ ${num(r.RBmax)} kΩ 之间取；取靠下限（约 ${num(r.RBmin * 1.5)} kΩ）可确保深度饱和、减少发热。` });
    n.push({ l: 'info', t: '深度饱和取 Ib = (3~10)·IC/β：倍数太小易退出饱和导致 VCE 上升发热，倍数太大驱动功耗与关断延迟增加。' });
    n.push({ l: 'info', t: '驱动感性负载（继电器/电磁阀）时务必加续流二极管，否则关断瞬间尖峰会击穿三极管。' });
    return n;
  },
  sch: (v, r) => `<svg class="gsch" viewBox="0 0 920 430" preserveAspectRatio="xMidYMid meet">
    <text class="lbl-b" x="560" y="40">VCC</text>

    ${G.node(560,280)}

    ${G.npn(560,310)}
    ${G.wire([[420,310],[540,310]])}
    ${G.node(420,310)}
    <circle cx="100" cy="310" r="5" class="comp"/>
    <text class="lbl-b" x="100" y="292">ctrl</text>
    ${G.wire([[100,310],[180,310]])}
    ${G.resH(180, 420, 310, 'Rb', {txt:`${num(r.RBmax)} kΩ`,kind:'act'})}
    ${G.resV(420, 310, 380, 'R1', null)}
    ${G.wire([[580,336],[580,390]])}
    ${G.wire([[420,380],[420,390],[580,390]])}
    ${G.node(580,390)}
    ${G.gnd(580,390)}
    ${G.tag(660,300,`Ib ${num(r.Ibmin, 0)}~${num(r.Ibmax, 0)} µA`)}
  </svg>`,
  formula: () => `<div class="mini" style="line-height:1.9">

tool({
  id: 'thermal', group: '器件与电路', name: '发热与结温', kw: '热阻 结温 tj thermal 发热 温升',

    { group: '结到 PCB', k: 'TB', label: 'PCB 板温度 TB', unit: '℃', def: 45, step: 1 },
    { group: '结到 PCB', k: 'RJB', label: '结到板热阻 RθJB', unit: '℃/W', def: 200, step: 10 },

    R.TjmaxCalc = Math.max(R.Tjc, R.Tja, R.Tjb);

      { k: 'Tja', label: 'Tj（结到空气）', unit: '℃', d: 1 },
      { k: 'Tjb', label: 'Tj（结到 PCB）', unit: '℃', d: 1 },
      { label: '最坏路径', text: () => r.worst, unit: '' }
    ]

      { k: 'PDmax_jc', label: '按 RθJC 允许的功耗', unit: 'mW', d: 1 },

  notes: (v, r) => {

    else if (r.margin < 10) n.push({ l: 'warn', t: `结温余量仅 ${num(r.margin, 1)} ℃，原表建议预留 10~15 ℃ 裕量，高温环境或长时间满载时风险高。` });
    else n.push({ l: 'ok', t: `结温余量 ${num(r.margin, 1)} ℃，满足预留 10~15 ℃ 的工程习惯。` });
    n.push({ l: 'info', t: '三条路径不是叠加关系，而是不同散热假设：实际封装内热流会同时经壳、引脚/PCB 与空气分流。按最坏一条判定最保守。' });
    n.push({ l: 'info', t: 'RθJA 是 JEDEC 标准板实测值，实际 PCB 铜箔面积、过孔、风冷都会显著改变结果，最终以热像仪或热电偶实测为准。' });

  },
  sch: (v, r) => `<svg class="gsch" viewBox="0 0 920 300" preserveAspectRatio="xMidYMid meet">

tool({
  id: 'snubber', group: '器件与电路', name: 'Snubber 吸收电路', kw: 'snubber 吸收 rc 振铃 阻尼 emi',
  sub: '由振铃频率偏移反推寄生 C0 / L，再算 RC 吸收参数',
  icon: '<path d="M2 10c2-6 4 6 6 0s4-4 6 0"/>',
  inputs: [
    { group: '测量值', k: 'f0', label: '原始振铃频率 f0', unit: 'MHz', def: 19.2, step: 0.1 },
    { group: '测量值', k: 'f1', label: '并电容后的频率 f1', unit: 'MHz', def: 12, step: 0.1 },
    { group: '测量值', k: 'Cp', label: '并联的电容值 Cp', unit: 'pF', def: 470, step: 10 },
    { group: '寄生参数', k: 'C0', label: '寄生电容 C0', derived: (v) => num(v.Cp / (Math.pow(v.f0 / v.f1, 2) - 1), 1) + ' pF' },
    { group: '寄生参数', k: 'L', label: '寄生电感 L', derived: (v) => { const k = Math.pow(v.f0 / v.f1, 2) - 1; return num(k / (4 * Math.PI * Math.PI * v.f0 * v.f0 * v.Cp) * 1e9, 1) + ' nH'; } }
  ],
  calc: v => {
    const R = {};
    R.k = v.f0 / v.f1;
    R.C0 = v.Cp / (R.k * R.k - 1);
    R.L = (R.k * R.k - 1) / (4 * Math.PI * Math.PI * v.f0 * v.f0 * v.Cp) * 1e9;
    R.Cs = 3 * R.C0 / 1000;                 // nF
    R.Rs = Math.sqrt(R.L / R.C0 * 1000);
    R.zeta0 = 0.05;
    R.zeta = (R.Rs / 2) * Math.sqrt(R.Cs * 1e-9 / (R.L * 1e-9));
    R.valid = R.k > 1;
    return R;
  },
  kpis: (v, r) => [
    { k: '寄生电容 C0', v: r.C0, unit: 'pF', hint: '由频率偏移反推' },
    { k: '寄生电感 L', v: r.L, unit: 'nH', hint: '回路寄生' },
    { k: '吸收电容 Cs', v: r.Cs, unit: 'nF', hint: '3×C0' },
    { k: '吸收电阻 Rs', v: r.Rs, unit: 'Ω', hint: `阻尼比 ζ ≈ ${num(r.zeta, 2)}` }
  ],
  outputs: (v, r) => [{
    section: '结果', items: [
      { label: '频率比 f0/f1', text: () => num(r.k, 3) },
      { k: 'C0', label: '寄生电容 C0', unit: 'pF', d: 1 },
      { k: 'L', label: '寄生电感 L', unit: 'nH', d: 1 },
      { k: 'Cs', label: '吸收电容 Cs', unit: 'nF', key: true, d: 3 },
      { k: 'Rs', label: '吸收电阻 Rs', unit: 'Ω', key: true, d: 2 },
      { k: 'zeta', label: '阻尼比 ζ', unit: '', d: 2 },
      { label: 'RC 时间常数', text: () => num(r.Rs * r.Cs * 1e-9 * 1e9, 2) + ' ns', unit: '' }
    ]
  }],
  notes: (v, r) => {
    const n = [];
    if (!r.valid) n.push({ l: 'err', t: '并联电容后频率必须下降（f1 < f0），否则数据不成立，请复测。' });
    n.push({ l: 'info', t: '原理：并已知电容 Cp 使振铃频率从 f0 降到 f1，由频率比反推回路 C0 与 L。测量时要保证 Cp 远大于探头与布线附加电容。' });
    n.push({ l: 'info', t: `Cs 取 3·C0 抑制振幅；Rs = √(L/C0) 使阻尼接近临界（当前 ζ ≈ ${num(r.zeta, 2)}）。` });
    n.push({ l: 'info', t: '增大 Cs 抑制振幅但增加开关损耗与充放电电流；减小 Cs 效率更高但振铃压不住。Rs 太小阻尼不足，太大会削弱吸收效果。' });
    n.push({ l: 'info', t: `Cs 的耐压按开关节点峰值取，建议 ≥ ${num(v.f0 > 0 ? 2 : 2)} 倍实际峰值；Rs 需选脉冲功率型（厚膜/绕线），平均功耗 ≈ Cs·V²·f。` });
    return n;
  },
  sch: (v, r) => `<svg class="gsch" viewBox="0 0 920 280" preserveAspectRatio="xMidYMid meet">
    ${G.wire([[100, 60], [420, 60]])}
    ${G.wire([[100, 60], [100, 110]])}
    ${G.box(420, 40, 140, 40, '开关节点', 'SW')}
    ${G.wire([[560, 60], [700, 60]])}
    ${G.wire([[700, 60], [700, 150]])}
    ${G.resH(700, 820, 150, 'Rs', {txt:`${num(r.Rs, 1)} Ω`,kind:'act'})}
    ${G.wire([[820, 150], [820, 190]])}
    ${G.capV(820, 190, 235, 'Cs', {txt:`${num(r.Cs)} nF`,kind:'act'})}
    ${G.gnd(820, 235)}
    ${G.box(180, 110, 180, 80, '寄生 C0 / L', `C0 ${num(r.C0)} pF · L ${num(r.L)} nH`)}
    ${G.tag(460, 230, `f0 ${v.f0} MHz → f1 ${v.f1} MHz`)}
  </svg>`,
  wave: (v, r) => {
    const N = 300, tmax = 2.5 / v.f0 * 1e3; // ns
    const a = [], b = [];
    /* 无吸收：阻尼比 ζ0≈0.05，自然频率 f0 */
    const z0 = 0.05;
    /* 加 RC：自然频率随总电容下降，阻尼比 r.zeta */
    const ratio = Math.sqrt(r.C0 / (r.C0 + r.Cs * 1000));
    const z = Math.max(0.3, Math.min(r.zeta, 0.95));
    for (let i = 0; i <= N; i++) {
      const t = tmax * i / N;
      const c = v.f0 * t / 1000;                 // 相对 f0 的周期数（MHz·ns·1e-3）
      a.push([t, Math.exp(-2 * Math.PI * z0 * c) * Math.cos(2 * Math.PI * c * Math.sqrt(1 - z0 * z0))]);
      const c2 = c * ratio;
      b.push([t, Math.exp(-2 * Math.PI * z * c2) * Math.cos(2 * Math.PI * c2 * Math.sqrt(1 - z * z))]);
    }
    return {
      x: { min: 0, max: tmax, unit: 'ns' },
      note: '无吸收 vs 加 RC 吸收的振铃包络对比（归一化）',
      legend: [{ t: '无 snubber (ζ≈0.05)', color: WCOL[2] }, { t: '加 RC 吸收', color: WCOL[0] }],
      panels: [{
        title: '振铃波形 (归一化)', ymin: -1, ymax: 1,
        series: [{ pts: a, color: WCOL[2] }, { pts: b, color: WCOL[0] }],
        hlines: [{ y: 0, color: '#3a5468' }]
      }]
    };
  },
  waveTitle: '振铃抑制效果',
  formula: () => `<div class="mini" style="line-height:1.9">
    k = f0/f1；C0 = Cp/(k²−1)；L = (k²−1)/(4π²f0²Cp)<br>
    Cs = 3·C0；Rs = √(L/C0)<br>
    单位：f MHz、C pF、L nH；√(nH/pF) = Ω
  </div>`
});

tool({

  sub: '同一层两根平行走线之间的耦合电容（边缘场近似）',

  notes: (v, r) => [
    { l: 'info', t: '平行走线间电容随线长线性增加、随间距反比下降；高速线上 0.1 pF 已可能带来可测的串扰。' },

  ],
  sch: (v, r) => {
    const Ox=460, Oy=175;
    const ux=1, uy=-0.14, vx=0.55, vy=-0.72;
    const P=(x,y,z)=>[Ox+x*ux+y*vx, Oy+x*uy+y*vy+z];
    const ps=a=>a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    const poly=(a,f,st)=>`<polygon points="${ps(a)}" fill="${f}" stroke="${st||'none'}" stroke-width="1.4" stroke-linejoin="round"/>`;
    const box=(x0,y0,x1,y1,zt,zb,ft,fs,st)=>{
      const A=P(x0,y0,zt),B=P(x1,y0,zt),C=P(x1,y1,zt),D=P(x0,y1,zt);
      const A2=P(x0,y0,zb),B2=P(x1,y0,zb),C2=P(x1,y1,zb),D2=P(x0,y1,zb);
      return poly([A,B,C,D],ft,st)+poly([A,B,B2,A2],fs,st)+poly([B,C,C2,B2],fs,st);
    };
    const dash=(p1,p2)=>`<line x1="${p1[0].toFixed(1)}" y1="${p1[1].toFixed(1)}" x2="${p2[0].toFixed(1)}" y2="${p2[1].toFixed(1)}" stroke="#e2504c" stroke-width="1.3" stroke-dasharray="5 4"/>`;

    const tx=(p,t,anc)=>`<text x="${p[0].toFixed(1)}" y="${p[1].toFixed(1)}" text-anchor="${anc||'middle'}" fill="#16324a" font-size="15" font-weight="700">${t}</text>`;
    const SUB_T='#e3edb4',SUB_S='#e6e3b0',TR_T='#f2f4f6',TR_S='#c6cdd3';
    let s='';
    /* 基板 */
    s+=box(-200,-70,200,70,0,34,SUB_T,SUB_S,'#c9d29a');

    s+=box(-150,-58,150,-22,0,11,TR_T,TR_S,'#aeb6bc');
    s+=box(-150,22,150,58,0,11,TR_T,TR_S,'#aeb6bc');
    /* d：两走线间距（内侧间隙） */
    s+=dash(P(120,-22,0),P(120,-22,-16));
    s+=dash(P(120,22,0),P(120,22,-16));
    s+=dim(P(120,-22,-10),P(120,22,-10));
    s+=tx(P(120,0,-24),'d');
    /* t：铜厚（右侧，黑色水平帽线 + 竖直双箭头） */
    const cap=(p1,p2)=>`<line x1="${p1[0].toFixed(1)}" y1="${p1[1].toFixed(1)}" x2="${p2[0].toFixed(1)}" y2="${p2[1].toFixed(1)}" stroke="#151515" stroke-width="1.8"/>`;
    s+=cap(P(150,58,0),P(230,58,0));
    s+=cap(P(150,58,11),P(230,58,11));
    s+=dim(P(230,58,0),P(230,58,11));
    s+=tx(P(248,58,10),'t');
    /* l：走线长度（前面） */
    s+=dash(P(-150,-70,0),P(-150,-70,28));
    s+=dash(P(150,-70,0),P(150,-70,28));
    s+=dim(P(-150,-70,22),P(150,-70,22));
    s+=tx(P(0,-70,38),'l');
    return `<svg viewBox="0 0 920 300" preserveAspectRatio="xMidYMid meet">
      <defs><marker id="arP" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e2504c"/></marker></defs>
      ${s}
    </svg>`;
  },
  formula: () => `<div class="mini">C = 8.854 · t · l / h　（l、h、t 单位 mm，结果 fF）<br>t = 铜厚(oz) × 0.034798</div>`
});

/* ---------- 走线寄生 + Z0 ---------- */
tool({
  id: 'pcb-trace', group: 'PCB 与互连', name: '走线寄生 L / C / Z0', kw: 'pcb 走线 阻抗 微带线 z0 分布参数',
  sub: '微带走线的分布电感、电容、电阻与特征阻抗',
  icon: '<path d="M2 10h12M4 10v3M12 10v3"/>',
  inputs: [
    { group: '几何', k: 'l', label: '走线长度 l', unit: 'mm', def: 100, step: 1 },
    { group: '几何', k: 'h', label: '介质厚度 h', unit: 'mm', def: 0.2, step: 0.05 },
    { group: '几何', k: 'oz', label: '铜厚', unit: 'oz', def: 1, step: 0.25 },
    { group: '几何', k: 'w', label: '走线宽度 w', unit: 'mm', def: 0.35, step: 0.01 },
    { group: '材料', k: 'er', label: '相对介电常数 εr', unit: '', def: 4.5, step: 0.1 },
    { group: '材料', k: 'T', label: '环境温度 T', unit: '℃', def: 25, step: 1 },
    { group: '材料', k: 't', label: '走线厚度 t', derived: (v) => num(v.oz * 0.0348, 4) + ' mm' }
  ],
  calc: v => {
    const R = {};
    R.t = v.oz * 0.0348;
    const ln = Math.log((5.98 * v.h) / (0.8 * v.w + R.t));
    R.k = ln;
    R.L = 0.2 * v.l * ln;                                     // nH
    R.C = (0.0264 * v.l * (v.er + 1.41)) / ln;                // pF
    R.Rs = (17 * (v.l / (R.t * v.w)) * (1 + 0.0039 * (v.T - 25))) / 1000;  // mΩ
    R.Z = Math.pow((R.L * 1000) / R.C, 0.5);                  // Ω
    R.td = Math.sqrt(R.L * 1e-9 * R.C * 1e-12) * 1e12;        // ps
    R.v = v.l / (R.td / 1000) / 1000;                          // mm/ps → 换算
    R.vmm = (R.td > 0) ? (v.l / (R.td)) * 1000 : 0;            // mm/ns
    return R;
  },
  kpis: (v, r) => [
    { k: '特征阻抗 Z0', v: r.Z, unit: 'Ω', hint: `目标通常 50 Ω`, cls: Math.abs(r.Z - 50) < 8 ? 'good' : '' },
    { k: '分布电感', v: r.L, unit: 'nH', hint: `≈ ${num(r.L / v.l, 3)} nH/mm` },
    { k: '分布电容', v: r.C, unit: 'pF', hint: `≈ ${num(r.C / v.l, 3)} pF/mm` },
    { k: '走线电阻', v: r.Rs, unit: 'mΩ', hint: `铜厚 ${v.oz} oz` }
  ],
  outputs: (v, r) => [{
    section: '结果', items: [
      { k: 't', label: '走线厚度 t', unit: 'mm', d: 4 },
      { k: 'L', label: '分布电感', unit: 'nH', d: 3 },
      { k: 'C', label: '分布电容', unit: 'pF', d: 4 },
      { k: 'Rs', label: '走线直流电阻', unit: 'mΩ', d: 2 },
      { k: 'Z', label: '特征阻抗 Z0', unit: 'Ω', key: true, d: 1 },
      { k: 'td', label: '走线延时', unit: 'ps', d: 1 }
    ]
  }],
  notes: (v, r) => {
    const n = [];
    if (Math.abs(r.Z - 50) > 10) n.push({ l: 'warn', t: `Z0 = ${num(r.Z, 1)} Ω 偏离 50 Ω 较多，高速链路会有反射；调整线宽 w 或介质厚度 h 使 Z0 落在 45~55 Ω。` });
    else n.push({ l: 'ok', t: `Z0 = ${num(r.Z, 1)} Ω，接近常用 50 Ω 目标。` });
    if (v.w < 0.05) n.push({ l: 'warn', t: `线宽 ${v.w} mm 过细（<2 mil），实际蚀刻公差与载流能力都会成为问题，请核对工艺能力。` });
    n.push({ l: 'info', t: '本式为工程近似（微带线经验公式），精确阻抗请用叠层厂商的场解算或 Polar/ Si9000 复核。' });
    n.push({ l: 'info', t: `该走线延时 ${num(r.td, 1)} ps，约 ${num(r.vmm, 2)} mm/ns；高速接口的等长匹配按此换算。` });
    return n;
  },
  sch: (v, r) => {
    const Ox=420, Oy=130;
    const P=(x,y,z)=>[Ox+x*1+y*0.5, Oy+x*(-0.10)+y*(-0.75)+z];
    const f=(pts,fill,st)=>`<polygon points="${pts.map(p=>{const q=P(p[0],p[1],p[2]);return q[0].toFixed(1)+','+q[1].toFixed(1);}).join(' ')}" fill="${fill}" stroke="${st||'none'}" stroke-width="1.3" stroke-linejoin="round"/>`;
    const ln=(p1,p2,extra)=>`<line x1="${P(p1[0],p1[1],p1[2])[0].toFixed(1)}" y1="${P(p1[0],p1[1],p1[2])[1].toFixed(1)}" x2="${P(p2[0],p2[1],p2[2])[0].toFixed(1)}" y2="${P(p2[0],p2[1],p2[2])[1].toFixed(1)}" ${extra||''}/>`;
    const tx=(p,t,anc)=>`<text x="${P(p[0],p[1],p[2])[0].toFixed(1)}" y="${P(p[0],p[1],p[2])[1].toFixed(1)}" text-anchor="${anc||'middle'}" fill="#151515" font-size="16" font-weight="700">${t}</text>`;
    const SUBT='#74ad71',SUBS='#68a066',GND='#f6b02e',TRT='#f9b826',TRS='#e8a31e';

    const ex=(p1,p2)=>ln(p1,p2,`stroke="${DK}" stroke-width="1.1" stroke-dasharray="4 4"`);
    let s='';

    s+=f([[-230,-92,0],[230,-92,0],[230,92,0],[-230,92,0]],SUBT,'#568754');
    /* 走线顶面 */
    s+=f([[-47,-14,0],[47,-14,0],[47,92,0],[-47,92,0]],TRT,'#d99a1c');
    /* 走线前面、右面 */
    s+=f([[-47,-14,0],[47,-14,0],[47,-14,12],[-47,-14,12]],TRS);
    s+=f([[47,-14,0],[47,92,0],[47,92,12],[47,-14,12]],TRS);
    /* 基板前面、右面 */

    s+=f([[-230,-92,52],[230,-92,52],[230,-92,60],[-230,-92,60]],GND);
    s+=f([[230,-92,52],[230,92,52],[230,92,60],[230,-92,60]],GND);
    /* h：介质厚度（最左悬空标注，仅介质，不含底部铜） */
    const sl=(p1,p2)=>ln(p1,p2,`stroke="${DK}" stroke-width="1.5"`);
    s+=sl([-230,-92,0],[-282,-92,0]);
    s+=sl([-230,-92,52],[-282,-92,52]);
    s+=ar([-282,-92,0],[-282,-92,52]);
    s+=tx([-264,-92,30],'h','middle');
    /* t：走线厚度（前左） */
    s+=ex([-47,-14,0],[-68,-14,0]);
    s+=ex([-47,-14,12],[-68,-14,12]);
    s+=ar([-68,-14,0],[-68,-14,12]);
    s+=tx([-84,-14,12],'t','end');
    /* w：走线宽度（前） */
    s+=ex([-47,-14,0],[-47,-14,-16]);
    s+=ex([47,-14,0],[47,-14,-16]);
    s+=ar([-47,-14,-10],[47,-14,-10]);
    s+=tx([0,-14,-24],'w');
    /* l：走线长度（沿右缘，悬浮） */
    s+=ar([55,-14,0],[55,92,0]);
    s+=tx([70,40,0],'l','start');
    return `<svg viewBox="0 0 920 300" preserveAspectRatio="xMidYMid meet">
      <defs><marker id="arB" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="${DK}"/></marker></defs>

  formula: () => `<div class="mini" style="line-height:1.9">
    t = oz × 0.0348 mm；k = ln(5.98h / (0.8w + t))<br>
    L = 0.2·l·k　nH；C = 0.0264·l·(εr+1.41)/k　pF<br>
    R = 17·l/(t·w)·(1+0.0039(T−25)) / 1000　mΩ<br>

  </div>`
});

/* ---------- 温度补偿（电压型分压） ---------- */
const ntcAt = (T) => {
  let i = Math.round(T - (-40));
  i = Math.max(0, Math.min(NTC_DATA.length - 1, i));
  const r = NTC_DATA[i];
  return { t: r[0], min: r[1], typ: r[2], max: r[3] };
};
/* 由 NTC 电阻值（kΩ，按 TYP 档）反查温度，线性插值 */
const tempFromR = (rK) => {
  for (let i = 0; i < NTC_DATA.length - 1; i++) {
    const a = NTC_DATA[i], b = NTC_DATA[i + 1];
    if (rK <= a[2] + 1e-9 && rK >= b[2] - 1e-9) {
      const f = (a[2] - rK) / (a[2] - b[2]);
      return a[0] + (b[0] - a[0]) * f;
    }
  }
  return rK >= NTC_DATA[0][2] ? NTC_DATA[0][0] : NTC_DATA[NTC_DATA.length - 1][0];
};
/* 实际 VTC(TYP) 曲线与目标电压 VTC1/VTC2 的交叉温度（随实际取值与目标变化） */
const crossTemp = (curve, target) => {
  for (let i = 0; i < curve.length - 1; i++) {
    const a = curve[i], b = curve[i + 1];
    const va = a.vtcTyp, vb = b.vtcTyp;
    if ((target <= va && target >= vb) || (target >= va && target <= vb)) {
      if (va === vb) return a.t;
      const f = (va - target) / (va - vb);
      return a.t + (b.t - a.t) * f;
    }
  }
  return null;
};
const VGH1 = (vtc, v) => vtc >= v.VTC2 ? v.VGH_LT : vtc <= v.VTC1 ? v.VGH_NT : (v.VGH_LT - v.VGH_NT) * ((vtc - v.VTC1) / (v.VTC2 - v.VTC1)) + v.VGH_NT;

tool({
  id: 'ntc-tc1', group: '系统与信号', name: '温补电路 · 电压型', kw: 'ntc 温度补偿 vgh 分压 液晶',
  sub: 'VCC 经 R1 与 (R2∥NTC) 分压得到 VTC，再由 VTC 映射 VGH；含 166 点 NTC 曲线全温校核',
  icon: '<path d="M2 8h4l2-4 2 8 2-4h4"/>',
  inputs: [
    { group: '电源与目标', k: 'VCC', label: 'VCC', unit: 'V', def: 3.3, step: 0.1 },
    { group: '电源与目标', k: 'VGH_LT', label: '低温端 VGH_LT', unit: 'V', def: 36, step: 0.5 },
    { group: '电源与目标', k: 'VGH_NT', label: '常温端 VGH_NT', unit: 'V', def: 30, step: 0.5 },
    { group: '转折点设定', k: 'VTC1', label: 'VTC1（高温转折点）', unit: 'V', def: 1.4, step: 0.01 },
    { group: '转折点设定', k: 'VTC2', label: 'VTC2（低温转折点）', unit: 'V', def: 1.6, step: 0.01 },
    { group: '转折点设定', k: 'NTC1', label: 'NTC1（VTC1 温度点）', unit: 'kΩ', def: 67.962, step: 0.5, hint: '查 NTC 曲线' },
    { group: '转折点设定', k: 'NTC2', label: 'NTC2（VTC2 温度点）', unit: 'kΩ', def: 105.14, step: 0.5 },
    { group: '实际取值', k: 'R1', label: 'R1 设定', unit: 'kΩ', def: 56, step: 1 },
    { group: '实际取值', k: 'R2', label: 'R2 设定', unit: 'kΩ', def: 107, step: 1 }
  ],
  calc: v => {
    const R = {};
    const par = (a, b) => (a * b) / (a + b);
    const k1 = (1 - v.VTC1 / v.VCC) / (v.VTC1 / v.VCC);
    R.R2 = ((((v.VCC - v.VTC2) / v.VTC2) * (v.VTC1 / (v.VCC - v.VTC1)) * v.NTC1 * v.NTC2) - v.NTC1 * v.NTC2) /
      (v.NTC1 - ((v.VCC - v.VTC2) / v.VTC2) * (v.VTC1 / (v.VCC - v.VTC1)) * v.NTC2);
    R.R1 = k1 * par(R.R2, v.NTC1);
    R.R1back = k1 * par(v.R2, v.NTC1);
    const vtc = (n) => (par(v.R2, n) / (v.R1 + par(v.R2, n))) * v.VCC;
    R.curve = NTC_DATA.map(d => ({
      t: d[0],
      vtcMin: vtc(d[1]), vtcTyp: vtc(d[2]), vtcMax: vtc(d[3]),
      gMin: VGH1(vtc(d[1]), v), gTyp: VGH1(vtc(d[2]), v), gMax: VGH1(vtc(d[3]), v)
    }));
    R.gSpread = Math.max(...R.curve.map(c => Math.max(c.gMin, c.gTyp, c.gMax) - Math.min(c.gMin, c.gTyp, c.gMax)));
    R.gMinAll = Math.min(...R.curve.map(c => Math.min(c.gMin, c.gTyp, c.gMax)));
    R.gMaxAll = Math.max(...R.curve.map(c => Math.max(c.gMin, c.gTyp, c.gMax)));
    return R;
  },
  kpis: (v, r) => [
    { k: 'R1 计算值', v: r.R1, unit: 'kΩ', hint: '按 VTC1 反算' },
    { k: 'R2 计算值', v: r.R2, unit: 'kΩ', hint: '按两点联立' },
    { k: 'R1 反算值', v: r.R1back, unit: 'kΩ', hint: `设定 ${v.R1} kΩ`, cls: Math.abs(r.R1back - v.R1) / Math.max(v.R1, 1) < 0.05 ? 'good' : 'bad' },
    { k: '全温 VGH 波动', v: r.gSpread, unit: 'V', hint: `范围 ${num(r.gMinAll, 1)} ~ ${num(r.gMaxAll, 1)} V` }
  ],
  outputs: (v, r) => [{

    ]
  }, {
    section: '转折点', items: [
      { label: 'VTC1 / VTC2', text: () => `${v.VTC1} V / ${v.VTC2} V`, unit: '' },
      { label: '对应 VGH', text: () => `${v.VGH_LT} V → ${v.VGH_NT} V`, unit: '' },
      { k: 'gSpread', label: '全温 VGH 波动', unit: 'V', d: 2 },
      { k: 'gMinAll', label: '全温最小 VGH', unit: 'V', d: 2 }
    ]
  }],
  notes: (v, r) => {
    const n = [];
    n.push({ l: 'info', t: '工作原理：R2 与 NTC 并联后的阻值随温度升高而下降，分压点 VTC 随之变化，再线性映射成 VGH。VTC 越高 → VGH 越低（低温端）。' });
    n.push({ l: r.gSpread < 0.5 ? 'ok' : 'warn', t: `按所选 NTC 的 MIN/TYP/MAX 三档，全温 VGH 波动 ${num(r.gSpread, 2)} V（${num(r.gMinAll, 1)} ~ ${num(r.gMaxAll, 1)} V）。波动越小，批量一致性越好。` });
    n.push({ l: 'info', t: `R1 设定 ${v.R1} kΩ 与反算值 ${num(r.R1back, 2)} kΩ 的偏差 ${num((r.R1back - v.R1) / v.R1 * 100, 2)}%，建议控制在实际电阻的 1% 精度以内。` });

  },

/* ---------- 温度补偿（电流源型） ---------- */
const VGH2 = (vtc, v) => vtc >= v.VTC2 ? v.VGH_LT : vtc <= v.VTC1 ? v.VGH_NT : (v.VGH_LT - v.VGH_NT) * ((vtc - v.VTC1) / (v.VTC2 - v.VTC1)) + v.VGH_NT;

tool({
  id: 'ntc-tc2', group: '系统与信号', name: '温补电路 · 电流源型', kw: 'ntc 温度补偿 电流源 vgh',
  sub: '恒流源 I 流过 (R2∥NTC)+R1，VTC = I·(R2∥NTC + R1)；R2 由一元二次方程求解',
  icon: '<path d="M2 8h4l2-4 2 8 2-4h4"/>',
  inputs: [
    { group: '目标', k: 'VGH_LT', label: '低温端 VGH_LT', unit: 'V', def: 30, step: 0.5 },
    { group: '目标', k: 'VGH_NT', label: '常温端 VGH_NT', unit: 'V', def: 25, step: 0.5 },
    { group: '目标', k: 'I', label: '电流源电流 I', unit: 'µA', def: 20, step: 1 },
    { group: '转折点', k: 'VTC1', label: 'VTC1（高温转折点）', unit: 'V', def: 1.7, step: 0.01 },
    { group: '转折点', k: 'VTC2', label: 'VTC2（低温转折点）', unit: 'V', def: 1.8, step: 0.01 },
    { group: '转折点', k: 'NTC1', label: 'NTC1（VTC1 温度点）', unit: 'kΩ', def: 16.433, step: 0.5 },
    { group: '转折点', k: 'NTC2', label: 'NTC2（VTC2 温度点）', unit: 'kΩ', def: 24.591, step: 0.5 },
    { group: '实际取值', k: 'R1', label: 'R1 设定', unit: 'kΩ', def: 71.5, step: 1 },
    { group: '实际取值', k: 'R2', label: 'R2 设定', unit: 'kΩ', def: 71.5, step: 1 }
  ],
  calc: v => {
    const R = {};
    const par = (a, b) => (a * b) / (a + b);
    const A = (v.VTC1 - v.VTC2) * (v.NTC1 + v.NTC2) * 1000;
    const Bq = v.I * (v.NTC1 - v.NTC2) * 0.001 - (v.VTC1 - v.VTC2);
    const Cq = -(v.VTC1 - v.VTC2) * v.NTC1 * v.NTC2 * 1e6;
    const disc = A * A - 4 * Bq * Cq;
    R.disc = disc;
    if (disc >= 0 && Math.abs(Bq) > 1e-12) {
      R.R2a = ((A + Math.sqrt(disc)) / (2 * Bq)) * 0.001;
      R.R2b = ((A - Math.sqrt(disc)) / (2 * Bq)) * 0.001;
    } else { R.R2a = NaN; R.R2b = NaN; }
    R.R2root = (R.R2a > 0 && isFinite(R.R2a)) ? R.R2a : (R.R2b > 0 && isFinite(R.R2b) ? R.R2b : NaN);
    R.R1calc = (v.VTC1 * 1000 - par(R.R2root, v.NTC1) * v.I) / v.I;
    R.R1back = (v.VTC1 * 1000 - par(v.R2, v.NTC1) * v.I) / v.I;
    const vtc = (n) => ((par(v.R2, n) + v.R1) * v.I) * 0.001;
    R.curve = NTC_DATA.map(d => ({
      t: d[0], nMin: d[1], nTyp: d[2], nMax: d[3],
      vtcMin: vtc(d[1]), vtcTyp: vtc(d[2]), vtcMax: vtc(d[3]),
      gMin: VGH2(vtc(d[1]), v), gTyp: VGH2(vtc(d[2]), v), gMax: VGH2(vtc(d[3]), v)
    }));
    R.gSpread = Math.max(...R.curve.map(c => Math.max(c.gMin, c.gTyp, c.gMax) - Math.min(c.gMin, c.gTyp, c.gMax)));
    return R;
  },
  kpis: (v, r) => [
    { k: 'R2 计算值（取正根）', v: r.R2root, unit: 'kΩ', hint: `另一根 ${num(r.R2b, 2)} kΩ`, cls: isFinite(r.R2root) ? 'good' : 'bad' },
    { k: 'R1 计算值', v: r.R1calc, unit: 'kΩ', hint: '按 VTC1 反算' },
    { k: 'R1 反算值', v: r.R1back, unit: 'kΩ', hint: `设定 ${v.R1} kΩ` },
    { k: '全温 VGH 波动', v: r.gSpread, unit: 'V', hint: 'MIN/MAX 三档包络' }
  ],
  outputs: (v, r) => [{
    section: '方程解', items: [
      { k: 'R2root', label: 'R2 计算值（正根）', unit: 'kΩ', key: true, d: 2 },
      { k: 'R2a', label: 'R2 根 1', unit: 'kΩ', d: 2 },
      { k: 'R2b', label: 'R2 根 2', unit: 'kΩ', d: 2 },
      { k: 'R1calc', label: 'R1 计算值', unit: 'kΩ', key: true, d: 2 },
      { k: 'R1back', label: 'R1 设定反算值', unit: 'kΩ', d: 2 }
    ]
  }, {
    section: '全温表现', items: [
      { k: 'gSpread', label: 'VGH 波动', unit: 'V', d: 2 },
      { label: 'VTC 工作区间', text: () => `${num(r.curve[0].vtcMin, 2)} ~ ${num(r.curve[r.curve.length - 1].vtcMax, 2)} V`, unit: '' }
    ]
  }],
  notes: (v, r) => {
    const n = [];
    if (!isFinite(r.R2root)) n.push({ l: 'err', t: '一元二次方程无正根，检查 VTC1/VTC2 与 NTC1/NTC2 是否自洽（通常要求 VTC2 > VTC1 且 NTC2 > NTC1）。' });
    else n.push({ l: 'ok', t: `R2 有两个根 ${num(r.R2a, 3)} / ${num(r.R2b, 3)} kΩ，取正根 ${num(r.R2root, 2)} kΩ（另一个在物理上不可实现）。` });
    n.push({ l: 'info', t: '电流源型的优点：VTC 只与电流和电阻和值有关，对 NTC 的 β 离散不如电压型敏感；但需要稳定的恒流源（通常由 IC 内部提供）。' });
    n.push({ l: 'info', t: `R1 需按设定值反算，当前偏差 ${num((r.R1back - v.R1) / v.R1 * 100, 2)}%，建议 1% 精度电阻。` });
    return n;
  },
  sch: (v, r) => `<svg class="gsch" viewBox="0 0 920 320" preserveAspectRatio="xMidYMid meet">
    ${G.wire([[240, 50], [760, 50]])}
    ${G.source(760, 120, 'I 源', {inp:'I',val:v.I,unit:'µA'}, true)}

    ${G.wire([[240, 150], [540, 150]])}
    ${G.box(540, 120, 190, 90, 'VGH 映射', `${v.VGH_NT} ~ ${v.VGH_LT} V`)}

    ${G.tag(866, 168, 'VGH', 'start')}
    ${G.inp(430, 250, 118, 'VTC1', v.VTC1, 'VTC1', 'V')}
  </svg>`,
  wave: (v, r) => {
    const g = [[], [], []], vt = [[], [], []];
    r.curve.forEach(c => {

    return {

tool({
  id: 'spread', group: '系统与信号', name: '展频水波纹评估', kw: '展频 ssc 水波纹 emi 相位',
  sub: '帧与展频周期不同步时，行充电时间被周期性拉长/压缩，形成可见水波纹',
  icon: '<path d="M2 8c2-6 4 6 6 0s4 6 6 0"/>',
  inputs: [
    { group: '时序', k: 'T1', label: 'STV 上升沿 → CLK1 上升沿 T1', unit: 'µs', def: 8.296, step: 0.01 },
    { group: '时序', k: 'T2', label: 'CLK 宽度 T2', unit: 'µs', def: 8.296, step: 0.01 },
    { group: '时序', k: 'T3', label: 'CLK1 → CLK2 间隔 T3', unit: 'µs', def: 1.508, step: 0.01 },
    { group: '时序', k: 'T4', label: 'TP 下降沿 → CLK 下降沿 T4', unit: 'µs', def: 1, step: 0.01 },
    { group: '展频', k: 'MF', label: '展频频率 MF', unit: 'kHz', def: 60.05, step: 0.05 },
    { group: '展频', k: 'MR', label: '展频幅度 MR', unit: '%', def: 0.5, step: 0.1 },
    { group: '显示', k: 'refresh', label: '刷新率', unit: 'Hz', def: 600, step: 10 },
    { group: '显示', k: 'rows', label: '每帧行数', unit: '行', def: 15, step: 1 }
  ],
  calc: v => {
    const R = {};
    R.period = 1 / v.MF * 1000;          // µs
    R.quarter = 1 / (4 * v.MF) * 1000;   // µs
    R.ratioRefresh = v.MF * 1000 / v.refresh;
    R.ratioLine = (1 / v.MF * 1000) / v.T3;
    R.frameStep = (1 / v.refresh - Math.floor(v.MF * 1000 / v.refresh) * 1 / (v.MF * 1000)) * 1e6; // µs
    const mrAt = (t) => {
      const ph = t / R.period; const f = ph - Math.floor(ph);
      const u = (t / R.quarter) - Math.floor(t / R.quarter);
      if (f < 0.25) return v.MR * u;
      if (f < 0.5) return -v.MR * u + v.MR;
      if (f < 0.75) return -v.MR * u;
      return v.MR * u - v.MR;
    };
    R.frames = [];
    for (let n = 0; n < 4; n++) {
      const rows = [];
      for (let rw = 1; rw <= v.rows; rw++) {
        const tclk = v.T1 + v.T2 + (rw - 1) * v.T3 + n * R.frameStep;
        const tp = tclk - v.T4;
        rows.push({ row: rw, tclk, tp, mrClk: mrAt(tclk), mrTp: mrAt(tp), delta: mrAt(tp) - mrAt(tclk) });
      }
      R.frames.push(rows);
    }
    const all = R.frames.flat();
    R.maxAbs = Math.max(...all.map(a => Math.abs(a.delta)));
    R.maxRow = all.find(a => Math.abs(a.delta) === R.maxAbs);
    return R;
  },

  outputs: (v, r) => [{

      { k: 'maxAbs', label: '最大充电时间变化', unit: '%', key: true, d: 3 }

  }],
  notes: (v, r) => {

    n.push({ l: 'info', t: '水波纹成因：一行像素的充电时间取决于 CLK 下降沿落在展频三角波的哪个位置；若每帧的相位不同，充电时间逐帧变化 → 亮度变化 → 横向条纹。' });

  }),
  formula: () => `<div class="mini" style="line-height:1.9">

    { group: '时序', k: 'gate', label: 'gate 数', unit: '', def: 1, step: 1 },
    { group: '时序', k: 'SSCin', label: '输入 SSCG', unit: '%', def: 3, step: 0.1 },
    { group: '时序', k: 'SSCic', label: 'IC SSCG', unit: '%', def: 0.5, step: 0.1 },
    { group: '链路', k: 'lport', label: 'LVDS port', unit: '', def: 2, step: 1 },
    { group: '链路', k: 'mport', label: 'mini-LVDS port', unit: '', def: 2, step: 1 },
    { group: '链路', k: 'mpair', label: 'mini-LVDS pair', unit: '', def: 3, step: 1 },
    { group: '链路', k: 'eport', label: 'eDP port', unit: '', def: 2, step: 1 },
    { group: '链路', k: 'elane', label: 'eDP lane', unit: '', def: 4, step: 1 },
    { group: '链路', k: 'ilane', label: 'iSP lane', unit: '', def: 12, step: 1 },
    { group: '派生', k: 'blank', label: '消隐 HT / VT', derived: (v) => `${v.HT - v.AHT} / ${v.VT - v.AVT}` }
  ],
  calc: v => {
    const R = {};
    R.blankH = v.HT - v.AHT;
    R.blankV = v.VT - v.AVT;
    R.lvds = (v.HT * v.VT * v.refresh) / (v.lport * 1e6);
    R.lvdsS = R.lvds * (1 + v.SSCin / 100);
    R.mini = (v.HT * v.VT * v.bit * v.refresh * 3) / (v.mport * v.mpair * 2 * 1e6);
    R.miniS = R.mini * (1 + v.SSCic / 100);
    R.edp = (v.HT * v.VT * v.bit * v.refresh * 3 * 10 / 8) / (v.eport * v.elane * 1e9);
    R.edpS = R.edp * (1 + v.SSCin / 100);
    R.ui = 1 / R.edp;
    R.uiS = 1 / R.edpS;
    R.pclk = (v.HT * v.VT * v.refresh) / (v.eport * 1e6);
    R.pclkS = R.pclk * (1 + v.SSCin / 100);
    R.isp = (v.HT * v.VT * v.bit * v.refresh * 3 * 9 / 8) / (v.ilane * 1e9);
    R.ispS = R.isp * (1 + v.SSCic / 100);
    R.uiISP = 1 / R.isp;
    R.uiISPS = 1 / R.ispS;
    R.h1 = 1 / (v.VT * v.refresh * v.gate) * 1e6;
    return R;
  },
  kpis: (v, r) => [
    { k: 'LVDS 频率', v: r.lvds, unit: 'MHz', hint: `${v.lport} port` },
    { k: 'eDP 速率', v: r.edp, unit: 'Gbps', hint: `${v.eport} port × ${v.elane} lane` },
    { k: 'eDP 单 UI', v: r.ui, unit: 'ns', hint: `展频后 ${num(r.uiS, 4)} ns` },
    { k: '1H 时间', v: r.h1, unit: 'µs', hint: `${v.VT} line × ${v.refresh} Hz × ${v.gate} gate` }
  ],
  outputs: (v, r) => [{
    section: '链路频率', items: [
      { k: 'lvds', label: 'LVDS frequency', unit: 'MHz', d: 3 },
      { k: 'lvdsS', label: 'LVDS 展频后', unit: 'MHz', d: 3 },
      { k: 'mini', label: 'mini-LVDS frequency', unit: 'MHz', d: 3 },
      { k: 'miniS', label: 'mini-LVDS 展频后', unit: 'MHz', d: 3 }
    ]
  }, {
    section: 'eDP / iSP', items: [
      { k: 'edp', label: 'eDP 速率', unit: 'Gbps', d: 4 },
      { k: 'edpS', label: 'eDP 展频后', unit: 'Gbps', d: 4 },
      { k: 'ui', label: 'eDP 单 UI', unit: 'ns', key: true, d: 4 },
      { k: 'uiS', label: 'eDP 展频后 UI', unit: 'ns', d: 4 },
      { k: 'pclk', label: 'Pixel clock', unit: 'MHz', d: 3 },
      { k: 'isp', label: 'iSP 速率', unit: 'Gbps', d: 4 },
      { k: 'ispS', label: 'iSP 展频后速率', unit: 'Gbps', d: 4 },
      { k: 'uiISP', label: 'iSP 单 UI', unit: 'ns', d: 4 },
      { k: 'uiISPS', label: 'iSP 展频后 UI', unit: 'ns', d: 4 }
    ]
  }, {
    section: '扫描', items: [
      { k: 'h1', label: '1H 时间', unit: 'µs', key: true, d: 4 },
      { label: '消隐 HT / VT', text: () => `${r.blankH} / ${r.blankV}`, unit: '' },
      { label: '有效分辨率', text: () => `${v.AHT}×${v.AVT} @ ${v.refresh} Hz`, unit: '' }
    ]
  }],
  notes: (v, r) => {
    const n = [];
    n.push({ l: 'info', t: '链路总带宽 = HT·VT·刷新率·bit·通道复用系数；消隐行也占带宽，所以算速率要用 HT/VT 而不是 Active 值。' });
    n.push({ l: 'info', t: `eDP 用 8b/10b 编码（×10/8），iSP 用 9b/8b，LVDS 为并行差分不加编码开销。` });
    n.push({ l: 'info', t: '展频（SSCG）会把频率在标称值上下摆动，评估链路余量时要按「展频后」的峰值频率去看接收端能力。' });
    n.push({ l: 'info', t: `eDP 的 UI = 1/速率，是眼图与均衡调试的基本时间单位；本配置 ${num(r.ui * 1000, 1)} ps。` });
    return n;
  },
  sch: (v, r) => `<svg viewBox="0 0 920 300" preserveAspectRatio="xMidYMid meet">
    ${G.box(320, 40, 280, 60, '时序', `HT ${v.HT} · VT ${v.VT} · ${v.refresh} Hz`)}
    ${G.box(320, 130, 280, 66, '链路编码', `bit ${v.bit} · SSC ${v.SSCin}% / ${v.SSCic}%`)}
    ${G.wire([[460, 100], [460, 130]])}
    ${G.box(80, 210, 240, 60, 'LVDS / mini-LVDS', `${num(r.lvds, 1)} / ${num(r.mini, 1)} MHz`)}
    ${G.box(600, 210, 250, 60, 'eDP / iSP', `${num(r.edp, 2)} / ${num(r.isp, 2)} Gbps`)}
    ${G.wire([[380, 196], [380, 240]])}
    ${G.wire([[380, 240], [320, 240]])}
    ${G.wire([[380, 240], [600, 240]])}
    ${tag(460, 285, `1H = ${num(r.h1, 3)} µs`)}
  </svg>`,
  table: (v, r) => ({
    title: '各接口结果对比',
    head: ['接口', '速率', '单位', '展频后'],
    rows: [
      ['LVDS', num(r.lvds, 2), 'MHz', num(r.lvdsS, 2)],
      ['mini-LVDS', num(r.mini, 2), 'MHz', num(r.miniS, 2)],
      ['eDP', num(r.edp, 3), 'Gbps', num(r.edpS, 3)],
      ['iSP', num(r.isp, 3), 'Gbps', num(r.ispS, 3)],
      ['Pixel clock', num(r.pclk, 2), 'MHz', num(r.pclkS, 2)]
    ],
    hit: (row, i) => i === 0 && row[0] === 'eDP'
  }),
  formula: () => `<div class="mini" style="line-height:1.9">
    LVDS = HT·VT·f/(port·10⁶)；mini-LVDS = HT·VT·bit·f·3/(port·pair·2·10⁶)<br>
    eDP = HT·VT·bit·f·3·10/8/(port·lane·10⁹)；iSP = HT·VT·bit·f·3·9/8/(lane·10⁹)<br>
    UI = 1/f；1H = 1/(VT·f·gate)×10⁶
  </div>`
});

/* ============================ 启动 ============================ */
(function boot() {
  renderNav();
  const id = location.hash.replace('#', '');
  renderTool(TOOLMAP[id] ? id : TOOLS[0].id);

  /* 开启动画：到时自动收起，点击可跳过，尊重 reduced-motion */
  const splash = document.getElementById('splash');
  if (splash) {
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let gone = false;
    const dismiss = () => {
      if (gone) return;
      gone = true;
      splash.classList.add('done');
      setTimeout(() => splash.remove(), 600);
    };
    splash.addEventListener('click', dismiss);
    setTimeout(dismiss, reduce ? 600 : 1200);
  }
})();
</script>
</body>
</html>
