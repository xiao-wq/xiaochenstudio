<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>硬件计算工具集 · V9.0</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%2312a08c%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%230a5f55%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22url%28%23g%29%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2243%22%20font-family%3D%22ui-monospace%2Cmonospace%22%20font-size%3D%2227%22%20font-weight%3D%22700%22%20fill%3D%22%23eafffb%22%20text-anchor%3D%22middle%22%3EHW%3C%2Ftext%3E%3C%2Fsvg%3E">
<style>
:root{
  --bg:#f2f5f7;
  --panel:#ffffff;
  --ink:#0d1b28;
  --ink-2:#334c60;
  --muted:#6b7f90;
  --line:#e3eaee;
  --line-2:#eef3f5;
  --accent:#0d7a6c;
  --accent-2:#0a5f55;
  --accent-tint:#eaf6f3;
  --warn:#b26a00;
  --warn-tint:#fff6e6;
  --err:#b3261e;
  --err-tint:#fdeceb;
  --ok:#1c7a4a;
  --ok-tint:#eaf6ef;
  --wave-bg:#0a1521;
  --wave-grid:#1d2c3d;
  --wave-ink:#88a0b5;
  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --r:12px;
  --shadow:0 1px 2px rgba(13,27,40,.04),0 8px 24px -12px rgba(13,27,40,.12);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
::selection{background:#cdeae4}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:250px 1fr;height:100vh;overflow:hidden}
.side{background:#0d1b28;color:#cfe0e6;display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,#12a08c,#0a5f55);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:700;color:#eafffb;letter-spacing:.5px}
.brand-t{font-size:14px;font-weight:600;color:#f1f8f6;letter-spacing:.2px}
.brand-s{font-size:11px;color:#7f98a6;margin-top:1px;font-family:var(--mono)}
.search-wrap{padding:12px 14px 8px}
.search{width:100%;height:32px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#e6f1f4;padding:0 10px;font-size:12px;outline:none}
.search::placeholder{color:#6e8798}
.search:focus{border-color:#2f8d80;background:rgba(255,255,255,.08)}
.nav{flex:1;overflow-y:auto;padding:6px 8px 24px;scrollbar-width:thin}
.nav::-webkit-scrollbar{width:6px}
.nav::-webkit-scrollbar-thumb{background:#22404e;border-radius:3px}
.nav-group{padding:10px 8px 4px}
.nav-group h4{margin:0 0 4px;font-size:10px;letter-spacing:1.2px;color:#5f7d8d;font-weight:600;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;cursor:pointer;font-size:12.5px;color:#b9cdd6;position:relative;transition:background .12s,color .12s}
.nav-item:hover{background:rgba(255,255,255,.06);color:#eef7f7}
.nav-item.on{background:rgba(18,160,140,.16);color:#eafffb}
.nav-item.on::before{content:"";position:absolute;left:-8px;top:6px;bottom:6px;width:3px;border-radius:2px;background:#16b39c}
.nav-item svg{width:14px;height:14px;opacity:.75;flex:none}
.nav-item.on svg{opacity:1}
.side-foot{padding:10px 16px 16px;border-top:1px solid rgba(255,255,255,.07);font-size:10.5px;color:#5f7d8d;line-height:1.5}
.side-foot b{color:#8fbfb5;font-weight:500}

.main{overflow-y:auto;overflow-x:hidden;min-width:0}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:flex-start;justify-content:space-between;gap:20px;
  padding:16px 30px 12px;background:rgba(242,245,247,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tt h1{margin:0;font-size:21px;font-weight:650;letter-spacing:-.2px;display:flex;align-items:center;gap:10px}
.chip{font-size:10.5px;font-weight:600;letter-spacing:.4px;padding:2px 7px;border-radius:5px;background:var(--accent-tint);color:var(--accent-2);border:1px solid #cbeae2}
.tt p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.acts{display:flex;gap:8px;flex:none;padding-top:2px}
.btn{height:30px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink-2);
  font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.12s;white-space:nowrap}
.btn:hover{border-color:#c9d8de;background:#fbfdfd;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn svg{width:13px;height:13px;opacity:.8}
.content{padding:18px 30px 70px;max-width:1320px}
.menu-btn{display:none;flex:none;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);
  background:#fff;color:var(--ink-2);cursor:pointer;align-items:center;justify-content:center;margin-top:2px}
.menu-btn svg{width:19px;height:19px}
.menu-btn:hover{border-color:#c9d8de;background:#fbfdfd}
.nav-backdrop{display:none}

/* ---------- kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px 10px;box-shadow:var(--shadow)}
.kpi .k{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.kpi .v{font-family:var(--mono);font-size:23px;font-weight:600;letter-spacing:-.5px;line-height:1.2;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .u{font-size:11px;color:var(--muted);margin-left:4px;font-family:var(--sans);font-weight:400}
.kpi .h{font-size:10.5px;color:#8da0ae;margin-top:2px}
.kpi.good .v{color:var(--accent-2)}
.kpi.bad .v{color:var(--err)}

/* ---------- card ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line-2)}
.card-h .t{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.card-h .t .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.card-h .d{font-size:11px;color:var(--muted)}
.card-b{padding:14px 16px}

/* ---------- schematic ---------- */
.sch{background:
  linear-gradient(90deg,rgba(13,122,108,.035) 1px,transparent 1px) 0 0/24px 24px,
  linear-gradient(rgba(13,122,108,.035) 1px,transparent 1px) 0 0/24px 24px,#fcfdfd;
  padding:6px 4px}
.sch svg{display:block;width:100%;height:auto}
.sch .wire{stroke:#31485a;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sch .wire.thin{stroke-width:1.1;stroke:#8aa1b1}
.sch .comp{fill:#fff;stroke:#31485a;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.sch .comp-f{fill:#dfe9ee;stroke:#31485a;stroke-width:1.6}
.sch .node{fill:#31485a}
.sch .lbl{font-family:var(--sans);font-size:13px;fill:#5b7284;letter-spacing:.2px}
.sch .lbl-b{font-family:var(--sans);font-size:14px;fill:#1d3a4d;font-weight:600}
.sch .tag{font-family:var(--mono);font-size:13px;fill:#0a5f55;font-weight:600}
.sch .badge{cursor:default}
.sch .badge rect{fill:#eaf6f3;stroke:#8fd0c3;stroke-width:1;rx:4}
.sch .badge:hover rect{fill:#d7efe9;stroke:var(--accent)}
.sch .badge text{font-family:var(--mono);font-size:13px;fill:#0a5f55;font-weight:600}
.sch .badge.hl rect{fill:#0d7a6c;stroke:#0d7a6c}
.sch .badge.hl text{fill:#fff}
.sch .badge.hl{animation:hint 1.2s ease-out 2}
@keyframes hint{0%,100%{opacity:1}50%{opacity:.55}}
.sch .cur{stroke:#0d7a6c;stroke-width:1.2;fill:none}
.sch .cur-h{marker-end:url(#arw)}
.sch .dim{stroke:#9db4c0;stroke-width:1;stroke-dasharray:3 3}

/* ---------- form ---------- */
.grid2{display:grid;grid-template-columns:minmax(320px,420px) 1fr;gap:14px;align-items:start}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.tag-pill{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:5px;font-size:11px;font-weight:600;vertical-align:middle}
.tag-pill.th{color:#1f7d70;background:rgba(72,185,169,.16);border:1px solid rgba(72,185,169,.45)}
.tag-pill.act{color:#c7832c;background:rgba(232,163,61,.15);border:1px solid rgba(232,163,61,.45)}
.th-dot{background:#48b9a9!important}
.act-dot{background:#e8a33d!important}
/* 原理图与波形并排（宽屏），窄屏纵向堆叠 */
.sch-wave{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:14px;align-items:start}
@media (min-width:1100px){
  .sch-wave{grid-template-columns:minmax(0,1.32fr) minmax(0,1fr)}
  .sch-wave.single{grid-template-columns:1fr}
}
.fgroup{border-bottom:1px dashed var(--line);padding-bottom:10px;margin-bottom:10px}
.fgroup:last-child{border:0;margin:0;padding:0}
.fgroup>h5{margin:0 0 8px;font-size:11px;letter-spacing:.6px;color:var(--accent-2);font-weight:650;display:flex;align-items:center;gap:6px}
.fgroup>h5::before{content:"";width:3px;height:10px;border-radius:2px;background:var(--accent);opacity:.55}
.field{display:grid;grid-template-columns:1fr 118px;align-items:center;gap:8px;padding:3px 0}
.field .fl{font-size:12px;color:var(--ink-2);min-width:0;overflow-wrap:anywhere}
.field .fl small{display:block;font-size:10.5px;color:#93a6b3;line-height:1.35;margin-top:1px}
.iw{position:relative}
.inp{width:100%;height:31px;border:1px solid var(--line);border-radius:7px;background:#fbfcfd;padding:0 40px 0 9px;
  font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink);outline:none;transition:.12s}
.inp:hover{border-color:#cfdde4;background:#fff}
.inp:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(13,122,108,.11)}
.inp.bad{border-color:#e0a3a0;background:#fdf4f3}
.unit{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:10.5px;color:#8fa3b1;pointer-events:none}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
select.inp{padding:0 9px;font-family:var(--sans);font-size:12px}
.hint{font-size:10.5px;color:#9aacb8;margin:-2px 0 6px;line-height:1.45}
.derived{display:flex;align-items:center;justify-content:flex-end;gap:5px;height:31px;border-radius:7px;
  background:var(--accent-tint);border:1px dashed #b9e0d6;padding:0 9px;font-family:var(--mono);font-size:12.5px;color:var(--accent-2);font-weight:600}

/* ---------- results ---------- */
.rsection{margin-bottom:12px}
.rsection:last-child{margin:0}
.rsection h6{margin:0 0 5px;font-size:10.5px;letter-spacing:.6px;color:#8194a2;font-weight:600;text-transform:uppercase}
.rrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid #f1f5f7}
.rrow:last-child{border-bottom:0}
.rrow .rl{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.rrow .rv{font-family:var(--mono);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
.rrow .ru{font-size:10px;color:#93a6b3;font-weight:400;margin-left:3px;font-family:var(--sans)}
.rrow.key .rv{color:var(--accent-2)}
.rrow .sub{font-size:10px;color:#9aacb8;display:block;font-weight:400}
.badge-s{font-size:9.5px;padding:1px 5px;border-radius:4px;font-weight:600;letter-spacing:.3px}
.b-ok{background:var(--ok-tint);color:var(--ok)}
.b-warn{background:var(--warn-tint);color:var(--warn)}
.b-err{background:var(--err-tint);color:var(--err)}
.b-info{background:#eef4fa;color:#2f5f88}

/* ---------- warnings ---------- */
.notes{display:flex;flex-direction:column;gap:6px}
.note{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;line-height:1.5;padding:7px 10px;border-radius:8px;background:#f6f9fa;color:var(--ink-2);border:1px solid var(--line-2)}
.note i{font-style:normal;font-weight:700;flex:none;width:14px;text-align:center}
.note.warn{background:var(--warn-tint);border-color:#f2ddb5;color:#7a4b00}
.note.err{background:var(--err-tint);border-color:#f0c9c6;color:#8c1e19}
.note.ok{background:var(--ok-tint);border-color:#cbe9d7;color:#16603c}

/* ---------- waveform ---------- */
.wave-wrap{background:var(--wave-bg);border-radius:0 0 var(--r) var(--r);padding:10px 12px 8px}
#wave,#wave2{display:block;width:100%}
.wave-h{display:flex;align-items:center;justify-content:space-between;background:var(--wave-bg);padding:9px 16px 0}
.wave-h .lg{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:#8ea6ba}
.wave-h .lg span{display:flex;align-items:center;gap:5px}
.wave-h .lg i{width:14px;height:2px;border-radius:1px;display:inline-block}

/* ---------- table ---------- */
.tbl-wrap{overflow:auto;max-height:420px}
table.tbl{border-collapse:separate;border-spacing:0;width:100%;font-size:11.5px}
table.tbl th{position:sticky;top:0;background:#f7fafb;text-align:right;font-weight:600;color:var(--ink-2);padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
table.tbl th:first-child,table.tbl td:first-child{text-align:left}
table.tbl td{text-align:right;padding:5px 10px;border-bottom:1px solid #f2f6f8;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
table.tbl tr:hover td{background:#fafcfd}
table.tbl td.hit{background:#eaf6f3;color:#0a5f55;font-weight:600}
table.tbl th.grp{background:#eef4f5}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;padding:0 16px;border-bottom:1px solid var(--line);background:#fcfdfd}
.tab{height:34px;padding:0 12px;border:0;background:none;font-size:12px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent-2);border-bottom-color:var(--accent);font-weight:600}

/* ---------- misc ---------- */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mini{font-size:11px;color:var(--muted)}
.empty{color:#9aacb8;font-size:12px;padding:10px 0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:2px 8px;border-radius:20px;background:#f1f5f7;color:#5b7284}
.modal{position:fixed;inset:0;background:rgba(9,20,29,.45);display:none;place-items:center;z-index:100;padding:20px}
.modal.on{display:grid}
.modal .box{background:#fff;border-radius:16px;max-width:720px;width:100%;max-height:82vh;overflow:auto;padding:26px 30px 30px;box-shadow:0 30px 80px rgba(8,20,30,.3)}
.modal h3{margin:0 0 4px;font-size:18px}
.modal h4{margin:20px 0 6px;font-size:13px;color:var(--accent-2)}
.modal p,.modal li{font-size:12.5px;color:var(--ink-2);line-height:1.7}
.modal pre{background:#0d1b28;color:#cfe8e2;padding:12px 14px;border-radius:10px;overflow:auto;font-family:var(--mono);font-size:11px;line-height:1.6}
.modal .x{float:right;cursor:pointer;color:#93a6b3;font-size:20px;line-height:1}
@media (max-width:1040px){
  .app{grid-template-columns:1fr}
  .menu-btn{display:inline-flex}
  .side{
    position:fixed;top:0;left:0;bottom:0;width:282px;max-width:86vw;z-index:60;
    transform:translateX(-100%);transition:transform .24s ease;
    box-shadow:0 24px 60px rgba(8,20,30,.35)}
  body.nav-open .side{transform:translateX(0)}
  .nav-backdrop{display:block;position:fixed;inset:0;z-index:50;background:rgba(9,20,29,.46);
    opacity:0;pointer-events:none;transition:opacity .24s ease}
  body.nav-open .nav-backdrop{opacity:1;pointer-events:auto}
  .grid2{grid-template-columns:1fr}
  .grid4{grid-template-columns:1fr}
  .two-col{grid-template-columns:1fr}
  .topbar{flex-wrap:wrap;gap:10px;padding:12px 16px 10px}
  .tt{flex:1;min-width:0}
  .acts{flex-basis:100%;width:100%;flex-wrap:wrap;gap:7px;padding-top:0}
  .btn{flex:1 1 auto;min-width:0;justify-content:center;height:34px;padding:0 8px}
  .content{padding:14px 16px 60px}
  .sch{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .sch svg{min-width:720px}
}
@media (max-width:600px){
  body{font-size:13px}
  .tt h1{font-size:18px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:9px}
  .kpi{padding:10px 11px 9px}
  .kpi .v{font-size:20px}
  .field{grid-template-columns:1fr;gap:4px;align-items:stretch}
  .field .iw{width:100%}
  .inp{font-size:16px;height:38px}
  .sch-inp{font-size:16px}
  .card-b{padding:12px}
  .btn{font-size:11.5px}
}
@media print{.side,.acts,.menu-btn{display:none}.app{display:block;height:auto}body{background:#fff}}

/* ---------- 新 DCDC 原理图（G 元件库） ---------- */
.sch svg.gsch .comp{fill:none;stroke:#2b4760;stroke-width:2}
.sch svg.gsch .wire{stroke:#33506b;stroke-width:1.8}
.sch svg.gsch .wire.thin{stroke-width:1.3;stroke:#33506b}
.sch .vnode{fill:#0e9488;stroke:#fff;stroke-width:1.2}
.sch .comp-fill{fill:#eef4f8;stroke:#2b4760;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sch .vbadge{cursor:default}
.sch .vbadge rect{fill:#fff;stroke:#c2d4de;stroke-width:1}
.sch .vbadge:hover rect{stroke:#0e9488;fill:#e6f6f3}
.sch .vbadge.hl rect{stroke:#0e9488;fill:#e6f6f3;stroke-width:1.6}
.sch .vbadge text{font-family:var(--mono);font-size:13px;fill:#1f3a52;font-weight:600}
/* 图内可编辑输入框 */
.sch .sch-fo{overflow:visible}
.sch .sch-inp{width:100%;height:30px;border:1px solid #83b3a8;border-radius:6px;background:#fff;
  padding:0 3px;text-align:center;font-family:var(--mono);font-size:16px;font-weight:600;color:#1f3a52;min-width:0}
.sch .sch-inp:hover{border-color:#0e9488}
.sch .sch-inp:focus{border-color:#0d7a6c;box-shadow:0 0 0 2px rgba(13,122,108,.16);background:#fff;outline:none}
.sch .sch-field{display:flex;align-items:center;height:30px;gap:4px}
.sch .sch-field span{font-family:var(--sans);font-size:12px;font-weight:600;color:#6e8493;white-space:nowrap}
.sch .sch-field .sch-inp{flex:1 1 auto;min-width:0;width:auto;padding:0 2px}
/* 输入框 + 单位后缀 */
.sch .sch-unit-wrap{display:flex;align-items:center;gap:3px;height:30px}
.sch .sch-unit-wrap .sch-inp{flex:1 1 auto;min-width:0;width:auto;padding:0 2px}
.sch .sch-unit{font-family:var(--mono);font-size:11px;font-weight:600;color:#6e8493;white-space:nowrap}
/* 理论 / 实际独立分块的外框与标题 */
.sch .blk-frame{fill:none;stroke-width:1.4;stroke-dasharray:5 4;rx:8}
.sch .blk-frame.th{stroke:#8cc6ba}
.sch .blk-frame.act{stroke:#dfb579}
.sch .blk-title{font-family:var(--sans);font-size:13.5px;font-weight:700}
.sch .blk-title.th{fill:#0a5f55}
.sch .blk-title.act{fill:#875714}
/* 图内只读计算徽标：th 理论门槛（青）/ act 实际反算（琥珀） */
.sch .vcalc{cursor:default}
.sch .vcalc rect{stroke-width:1}
.sch .vcalc text{font-family:var(--mono);font-size:12.5px;font-weight:600}
.sch .vcalc.c-th rect{fill:#e2f2ee;stroke:#8cc6ba}
.sch .vcalc.c-th text{fill:#0a5f55}
.sch .vcalc.c-act rect{fill:#faf0dc;stroke:#dfb579}
.sch .vcalc.c-act text{fill:#875714}
.sch .vcalc.c-plain rect{fill:#eef4f8;stroke:#b9cad4}
.sch .vcalc.c-plain text{fill:#2b4760}
/* 图内小标注（元件旁的说明文字） */
.sch .ann-l{font-family:var(--sans);font-size:12.5px;fill:#7a8f9d;font-weight:500}
/* 图内标注图例：白框可输入 / 青色理论门槛 / 琥珀实际反算 */
.sch-legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sch-legend .lg{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:400;color:var(--muted)}
.sch-legend .sw{width:18px;height:12px;border-radius:3px;display:inline-block}
.sch-legend .sw-inp{background:#fff;border:1px solid #83b3a8}
.sch-legend .sw-th{background:#e2f2ee;border:1px solid #8cc6ba}
.sch-legend .sw-act{background:#faf0dc;border:1px solid #dfb579}
.kpi.warn .v{color:var(--warn)}
.note.info{background:#eef4fa;border-color:#cdddec;color:#2f5888}
@media (max-width:600px){.inp{font-size:16px}}

/* ============================ 开启动画 ============================ */
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(1200px 700px at 50% 38%,#10283a 0%,#0a1a27 52%,#07121c 100%);
  transition:opacity .55s ease,visibility .55s;overflow:hidden}
#splash.done{opacity:0;visibility:hidden;pointer-events:none}
#splash .sp-bg{position:absolute;inset:0;
  background-image:linear-gradient(rgba(120,180,200,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(120,180,200,.05) 1px,transparent 1px);
  background-size:34px 34px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 78%)}
#splash .sp-inner{position:relative;display:flex;flex-direction:column;align-items:center;width:min(88vw,760px)}
.sp-svg{width:100%;height:auto;overflow:visible}
.sp-traces path{stroke:#3fae9e;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:430;stroke-dashoffset:430;animation:spDraw .65s cubic-bezier(.6,.05,.3,1) forwards}
.sp-pins path{stroke:#5cc3b4;stroke-width:2.4;stroke-linecap:round;opacity:0;animation:spIn .3s ease .08s forwards}
.sp-chip{fill:#0e2231;stroke:#3f7d72;stroke-width:1.6;opacity:0;transform-box:fill-box;transform-origin:center;
  animation:spChip .45s cubic-bezier(.2,.8,.3,1) .03s forwards}
.sp-nodes circle{fill:#0a1a27;stroke:#56c8b6;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;
  animation:spNode .35s cubic-bezier(.2,.9,.3,1.4) forwards}
.sp-pulse-halo{fill:#5fe0cf;opacity:.32;filter:blur(1.5px)}
.sp-pulse-core{fill:#d6fff8;filter:drop-shadow(0 0 5px #6fe6d6)}
.sp-pulse{opacity:0;animation:spPulseVis .25s ease forwards}
.sp-text{display:flex;flex-direction:column;align-items:center;margin-top:18px}
.sp-brand{display:flex;align-items:center;gap:15px;opacity:0;animation:spUp .45s ease .3s forwards}
.sp-avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;display:block;
  border:1px solid rgba(92,195,180,.55);box-shadow:0 0 24px rgba(72,200,180,.32)}
.sp-logo{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font:700 20px ui-monospace,monospace;color:#dff7f2;background:linear-gradient(150deg,#16403a,#0e2a30);
  border:1px solid #2f6f64;box-shadow:0 0 26px rgba(72,200,180,.28)}
.sp-h1{margin:16px 0 6px;font-size:clamp(24px,5.4vw,34px);font-weight:700;letter-spacing:6px;color:#eef6f4;
  opacity:0;animation:spUp .5s ease .4s forwards}
.sp-p{margin:0;font-size:11px;letter-spacing:5px;color:#6f97a8;font-weight:500;
  opacity:0;animation:spUp .5s ease .5s forwards}
.sp-bar{margin-top:26px;width:min(240px,60vw);height:2px;border-radius:2px;background:rgba(120,170,180,.18);overflow:hidden}
.sp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3fae9e,#8fe6d8);
  animation:spBar .9s cubic-bezier(.4,.1,.2,1) .25s forwards}
.sp-skip{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:2px;color:#5d8090;
  opacity:0;animation:spIn .35s ease .7s forwards}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spIn{to{opacity:1}}
@keyframes spChip{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}
@keyframes spNode{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
@keyframes spUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes spBar{to{width:100%}}
@keyframes spPulseVis{to{opacity:1}}
.d1{animation-delay:.08s!important}.d2{animation-delay:.16s!important}.d3{animation-delay:.26s!important}
.n1{animation-delay:.55s!important}.n2{animation-delay:.66s!important}.n3{animation-delay:.78s!important}
.pu1{animation-delay:.35s!important}.pu2{animation-delay:.6s!important}.pu3{animation-delay:.85s!important}
@media (prefers-reduced-motion:reduce){
  .sp-traces path,.sp-pins path,.sp-chip,.sp-nodes circle,.sp-brand,.sp-avatar,.sp-h1,.sp-p,.sp-bar i,.sp-skip{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}
  .sp-bar i{width:100%!important}.sp-pulse{display:none}
}
</style>
</head>

<script>
/* ==========================================================================
   硬件计算工具集 · 内核
   ---------------------------------------------------------------------------
   一个工具 = 一个 tool({...}) 注册块，包含
     id / name / group / sub / desc
     inputs[]   参数（可分组、可派生只读、可选下拉）
     calc(v)    计算函数，返回任意命名的中间量对象
     kpis(v,r)  顶部关键指标
     outputs[]  结果分区列表，按 key 取值
     notes(v,r) 校验与经验提示
     sch(v,r)   原理图（返回 SVG 字符串，图上徽标 data-focus="key" 可点回输入）
     wave(v,r)  波形 / 曲线面板
     table(v,r) 明细表
   新增工具只需在文件末尾复制一个 tool(){} 块。
   ========================================================================== */
const TOOLS = [];
const TOOLMAP = {};
const GROUPS = ['电源拓扑', '复位与滤波', '器件与电路', 'PCB 与互连', '系统与信号'];
function tool(s) { TOOLS.push(s); TOOLMAP[s.id] = s; }

const LS_KEY = 'hwtools.v9';
let SAVED = {};
try { SAVED = JSON.parse(localStorage.getItem(LS_KEY) || '{}') || {}; } catch (e) { SAVED = {}; }
let saveTimer = null;
function persist() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(LS_KEY, JSON.stringify(SAVED)); } catch (e) {}
  }, 220);
}

/* ---------- 数值格式化 ---------- */
function num(x, d) {
  if (x === null || x === undefined || !isFinite(x)) return '—';
  if (d !== undefined) return x.toFixed(d);
  const a = Math.abs(x);
  if (a === 0) return '0';
  if (a >= 1e6) return (x / 1e6).toPrecision(4).replace(/\.?0+$/, '') + 'M';
  if (a >= 1e5) return (x / 1e3).toPrecision(4).replace(/\.?0+$/, '') + 'k';
  if (a >= 1000) return x.toFixed(a >= 1e4 ? 0 : 1);
  if (a >= 100) return x.toFixed(1).replace(/\.0$/, '');
  if (a >= 10) return x.toFixed(2).replace(/\.?0+$/, '');
  if (a >= 1) return x.toFixed(3).replace(/\.?0+$/, '');
  if (a >= 0.01) return x.toFixed(4).replace(/\.?0+$/, '');
  return x.toPrecision(3);
}
const fmt = num;
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

/* ---------- 状态读写 ---------- */
function defaults(t) {
  const v = {};
  (t.inputs || []).forEach(f => { if (!f.derived) v[f.k] = f.def; });
  return v;
}
function valuesOf(t) {
  const base = defaults(t);
  const s = SAVED[t.id] || {};
  const v = Object.assign({}, base);
  Object.keys(base).forEach(k => { if (typeof s[k] === 'number' && isFinite(s[k])) v[k] = s[k]; });
  return v;
}
function setValue(t, k, val) {
  SAVED[t.id] = SAVED[t.id] || {};
  SAVED[t.id][k] = val;
  persist();
}

/* ---------- 波形绘制 ---------- */
const WCOL = ['#4fd1c5', '#f2b56b', '#e2726e', '#7cb3e8', '#b6a7e0', '#9ad08f'];

/* ---------- 拐点检测与标注（drawWaves / drawChart 共用） ---------- */
function panelUnit(p){
  if(p.unit)return p.unit;
  const m=/\(([^()]+)\)\s*$/.exec(p.title||'');
  if(m){const u=m[1].trim();if(/^[A-Za-z%Ωµμ℃°]+$/.test(u)&&u.length<=4)return u;}
  return '';
}
function fmtWaveVal(y,unit){
  const ay=Math.abs(y);
  let s;
  if(ay>=100)s=num(y,0);
  else if(ay>=10)s=num(y,1);
  else if(ay>=1)s=num(y,2);
  else s=num(y,3);
  return s+(unit?' '+unit:'');
}
function waveKeyPoints(series,xspan,lo,hi){
  const yrange=(hi-lo)||1,ytol=yrange*0.01;
  const roundY=y=>Math.round(y/ytol);
  const anchors=[];
  series.forEach(s=>{
    const pts=s.pts;
    if(!pts||pts.length<3)return;
    const flat=i=>Math.abs(pts[i+1][1]-pts[i][1])<=0.0005*yrange;
    const dir=i=>{const d=pts[i+1][1]-pts[i][1];return Math.abs(d)>0.002*yrange?Math.sign(d):0;};
    const sg=i=>Math.sign(pts[i+1][1]-pts[i][1]);
    /* 台阶跳变：单段纵向变化很大且相邻段平直（方波/开关节点的孤立跳变），记录前后两电平 */
    for(let i=0;i<pts.length-1;i++){
      const p0=pts[i],p1=pts[i+1],dy=p1[1]-p0[1];
      if(Math.abs(dy)>0.2*yrange){
        const before=i===0||Math.abs(p0[1]-pts[i-1][1])<=0.03*yrange;
        const after=i>=pts.length-2||Math.abs(pts[i+2][1]-p1[1])<=0.03*yrange;
        if(before&&after){
          const mx=(p0[0]+p1[0])/2;
          anchors.push({x:mx,y:p0[1],color:s.color,kind:'step'});
          anchors.push({x:mx,y:p1[1],color:s.color,kind:'step'});
        }
      }
    }
    /* 局部极值（峰/谷，原始斜率反向，兼容尖峰与平滑峰）与钳位拐点（真平直段，需连续多段） */
    for(let i=1;i<pts.length-1;i++){
      const g1=sg(i-1),g2=sg(i);
      if(g1!==0&&g2!==0&&g1!==g2&&Math.abs(pts[i][1])>0.03*yrange){
        anchors.push({x:pts[i][0],y:pts[i][1],color:s.color,kind:'ext'});
      }
      const d1=dir(i-1),d2=dir(i);
      if((d1!==0&&d2===0)||(d1===0&&d2!==0)){
        let plateau=false;
        if(d2===0)plateau=flat(i)&&(i+1>=pts.length-1||flat(i+1));
        else plateau=flat(i-1)&&(i-2<0||flat(i-2));
        if(plateau)anchors.push({x:pts[i][0],y:pts[i][1],color:s.color,kind:'knee'});
      }
    }
  });
  /* 同电平去重（保留最靠左），再做近邻合并（同 x 且同 y 的多系列冗余点），按 x 排序；每面板限量防拥挤 */
  const kept=[];
  anchors.sort((a,b)=>a.x-b.x).forEach(a=>{
    if(kept.some(k=>roundY(k.y)===roundY(a.y)))return;
    if(kept.some(k=>Math.abs(k.x-a.x)<=0.03*xspan&&Math.abs(k.y-a.y)<=0.045*yrange))return;
    kept.push(a);
  });
  return kept.slice(0,10);
}
function drawKeyLabels(ctx,anchors,X,Y,L,Rm,W,plotTop,plotBot,unit){
  if(!anchors.length)return;
  ctx.font='500 9.5px ui-monospace,monospace';
  const estW=s=>{let w=0;for(const ch of s)w+=ch.charCodeAt(0)>255?10:6;return w;};
  const rects=[];
  const collides=(x,y,w)=>rects.some(r=>x<r.x+r.w+3&&x+w>r.x-3&&y<r.y+10&&y>r.y-10);
  anchors.forEach(a=>{
    const label=fmtWaveVal(a.y,unit),w=estW(label);
    const px=X(a.x),py=Y(a.y);
    const lx=Math.min(Math.max(px+3,L+1),W-Rm-w-1);
    const cands=[];
    for(let t=0;t<6;t++)cands.push(py-4-t*12);
    for(let t=0;t<6;t++)cands.push(py+13+t*12);
    let chosen=null;
    for(const cy of cands){
      if(cy<plotTop+4||cy>plotBot+6)continue;
      if(!collides(lx,cy,w)){chosen=cy;break;}
    }
    if(chosen===null)chosen=py;
    rects.push({x:lx,w,y:chosen});
    ctx.fillStyle=a.color;
    if(Math.abs(chosen-py)>6){ctx.globalAlpha=.55;ctx.strokeStyle=a.color;ctx.lineWidth=.8;
      ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px,chosen);ctx.stroke();ctx.globalAlpha=1;}
    ctx.beginPath();ctx.arc(px,py,2.2,0,Math.PI*2);ctx.fill();
    ctx.textAlign='left';
    ctx.fillText(label,lx,chosen+3);
  });
}

function drawWaves(cv, spec) {
  if (!cv || !spec || !spec.panels) return;
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const L = 46, Rm = 12, T = 6, B = 20;
  const n = spec.panels.length;
  const ph = (H - T - B) / n;
  const x0 = spec.x.min, x1 = spec.x.max;
  const lg = spec.x.log;
  const norm = x => lg ? (Math.log10(x) - Math.log10(x0)) / (Math.log10(x1) - Math.log10(x0)) : (x - x0) / (x1 - x0);
  const X = x => L + norm(x) * (W - L - Rm);

  spec.panels.forEach((p, i) => {
    const top = T + i * ph;
    const y0 = p.ymin !== undefined ? p.ymin : Math.min(...p.series.flatMap(s => s.pts.map(pt => pt[1])));
    const y1 = p.ymax !== undefined ? p.ymax : Math.max(...p.series.flatMap(s => s.pts.map(pt => pt[1])));
    const pad = (y1 - y0) * (p.pad !== undefined ? p.pad : 0.14) || Math.abs(y1) * 0.1 || 1;
    const lo = y0 - pad, hi = y1 + pad;
    const Y = y => top + 16 + (hi - y) / (hi - lo) * (ph - 32);

    /* 网格 */
    ctx.strokeStyle = '#1d2c3d'; ctx.lineWidth = 1;
    [0, 0.5, 1].forEach(f => {
      const yg = top + 16 + f * (ph - 32);
      ctx.beginPath(); ctx.moveTo(L, yg); ctx.lineTo(W - Rm, yg); ctx.stroke();
    });
    if (lo < 0 && hi > 0) {
      ctx.strokeStyle = '#2b4152'; ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(L, Y(0)); ctx.lineTo(W - Rm, Y(0)); ctx.stroke();
      ctx.setLineDash([]);
    }
    /* 参考线 */
    (p.hlines || []).forEach(h => {
      ctx.strokeStyle = h.color || '#6f8ba0'; ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(L, Y(h.y)); ctx.lineTo(W - Rm, Y(h.y)); ctx.stroke();
      ctx.setLineDash([]);
      if (h.label) {
        ctx.fillStyle = h.color || '#8aa3b7'; ctx.font = '500 9.5px ui-monospace,monospace';
        ctx.textAlign = 'right'; ctx.fillText(h.label, W - Rm - 3, Y(h.y) - 4 + (h.labDy || 0));
      }
    });
    /* 曲线 */
    p.series.forEach(s => {
      ctx.strokeStyle = s.color || WCOL[0];
      ctx.lineWidth = s.width || 1.6;
      ctx.setLineDash(s.dash ? [5, 4] : []);
      ctx.beginPath();
      s.pts.forEach((pt, j) => {
        const px = X(pt[0]), py = Y(pt[1]);
        j ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      });
      ctx.stroke();
      ctx.setLineDash([]);
      if (s.fill) { /* 简单填充到底部 */
        ctx.fillStyle = s.fill; ctx.beginPath();
        s.pts.forEach((pt, j) => { const px = X(pt[0]), py = Y(pt[1]); j ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
        ctx.lineTo(X(s.pts[s.pts.length - 1][0]), top + 16 + ph - 32);
        ctx.lineTo(X(s.pts[0][0]), top + 16 + ph - 32);
        ctx.closePath(); ctx.fill();
      }
    });
    (p.vlines || []).forEach(vl => {
      ctx.strokeStyle = vl.color || '#f2b56b'; ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(X(vl.x), top + 14); ctx.lineTo(X(vl.x), top + 16 + ph - 32); ctx.stroke();
      ctx.setLineDash([]);
    });
    if (p.vlines && p.vlines.length) {
      /* 标签防重叠：按 x 放置，同层冲突则向下错层 */
      const estW = s => {
        let w = 0;
        for (const ch of s) w += ch.charCodeAt(0) > 255 ? 10 : 6;
        return w + 4;
      };
      const placed = [];
      p.vlines.slice().sort((a, b) => a.x - b.x).forEach(vl => {
        const w = estW(vl.label || '');
        const right = norm(vl.x) > 0.82;
        let lx = right ? X(vl.x) - 3 - w : X(vl.x) + 3;
        let tier = vl.tier || 0;
        while (tier < 3 && placed.some(z => z.tier === tier && !(lx + w < z.x - 1 || lx > z.x + z.w + 1))) tier++;
        placed.push({ x: lx, w, tier });
        ctx.fillStyle = vl.color || '#f2b56b'; ctx.font = '500 9.5px ui-monospace,monospace';
        ctx.textAlign = 'left';
        ctx.fillText(vl.label, lx, top + 20 + tier * 12);
      });
    }
    /* 拐点数值标注 */
    if (!p.noKeys) drawKeyLabels(ctx,waveKeyPoints(p.series,x1-x0,lo,hi),X,Y,L,Rm,W,top+16,top+16+ph-32,panelUnit(p));
    /* 面板标题 + 刻度 */
    ctx.fillStyle = '#9fb6c8'; ctx.font = '600 10px ui-monospace,monospace'; ctx.textAlign = 'left';
    ctx.fillText(p.title, L + 2, top + 10);
    ctx.fillStyle = '#5f7d90'; ctx.font = '9.5px ui-monospace,monospace'; ctx.textAlign = 'right';
    const span = Math.abs(hi - lo);
    const dec = span >= 200 ? 0 : span >= 20 ? 1 : span >= 2 ? 2 : 3;
    ctx.fillText(num(hi, dec), L - 4, top + 21);
    ctx.fillText(num(lo, dec), L - 4, top + 16 + ph - 36);
  });
  /* x 轴 */
  const ticks = 6;
  ctx.strokeStyle = '#1d2c3d'; ctx.beginPath(); ctx.moveTo(L, H - B + 4); ctx.lineTo(W - Rm, H - B + 4); ctx.stroke();
  ctx.fillStyle = '#5f7d90'; ctx.font = '9.5px ui-monospace,monospace'; ctx.textAlign = 'center';
  if (lg) {
    const a = Math.ceil(Math.log10(x0)), b = Math.floor(Math.log10(x1));
    for (let e = a; e <= b; e++) {
      const xv = Math.pow(10, e);
      ctx.beginPath(); ctx.moveTo(X(xv), H - B + 1); ctx.lineTo(X(xv), H - B + 6); ctx.stroke();
      if (e % ((b - a) > 5 ? 2 : 1) === 0) ctx.fillText(num(xv, 0) + (e >= 6 ? 'M' : e >= 3 ? 'k' : ''), X(xv), H - B + 15);
    }
  } else {
    const span=x1-x0;
    /* 选漂亮主刻度步长（目标约 12 个主刻度），次刻度为主步长的一半 */
    const raw=span/12,mag=Math.pow(10,Math.floor(Math.log10(raw))),nz=raw/mag;
    const step=nz<1.5?mag:nz<3?2*mag:nz<7?5*mag:10*mag;
    const minor=step/2;
    ctx.strokeStyle='#1d2c3d';ctx.lineWidth=1;
    for(let t=Math.ceil(x0/minor)*minor;t<=x1+1e-9;t+=minor){
      ctx.beginPath();ctx.moveTo(X(t),H-B+2);ctx.lineTo(X(t),H-B+6);ctx.stroke();
    }
    ctx.strokeStyle='#33505f';ctx.fillStyle='#7d97ab';
    for(let t=Math.ceil(x0/step)*step;t<=x1+1e-9;t+=step){
      ctx.beginPath();ctx.moveTo(X(t),H-B+1);ctx.lineTo(X(t),H-B+8);ctx.stroke();
      ctx.fillText(num(t,step<1?1:0),Math.min(Math.max(X(t),L+10),W-Rm-10),H-B+16);
    }
  }
  if (spec.x.unit) {
    ctx.fillStyle = '#88a0b5'; ctx.textAlign = 'right'; ctx.font = '9.5px system-ui';
    ctx.fillText(spec.x.unit, W - Rm, H - B - 2);
  }
}

function renderNav(filter) {
  const nav = document.getElementById('nav');
  const q = (filter || '').trim().toLowerCase();
  let html = '';
  GROUPS.forEach(g => {
    const items = TOOLS.filter(t => t.group === g && (!q || (t.name + t.sub + (t.kw || '')).toLowerCase().includes(q)));
    if (!items.length) return;
    html += `<div class="nav-group"><h4>${esc(g)}</h4>`;
    items.forEach(t => {
      html += `<div class="nav-item ${CUR && CUR.id === t.id ? 'on' : ''}" data-id="${t.id}">
        <svg viewBox="0 0 16 16" fill="none" stroke="#8fd0c3" stroke-width="1.4">${t.icon || '<rect x="3" y="3" width="10" height="10" rx="2"/>'}</svg>

  document.getElementById('toolCount').textContent = TOOLS.length;
}

function renderForm(t, v) {
  const form = document.getElementById('form');
  let html = '', lastGroup = null;
  (t.inputs || []).forEach(f => {
    if (f.group !== lastGroup) {
      if (lastGroup !== null) html += '</div>';
      html += `<div class="fgroup"><h5>${esc(f.group || '参数')}</h5>`;
      lastGroup = f.group;
    }
    if (f.derived) {
      html += `<div class="field"><div class="fl">${esc(f.label)}</div><div class="iw"><div class="derived" id="dv_${f.k}">—</div></div></div>`;
    } else if (f.type === 'select') {
      html += `<div class="field"><div class="fl">${esc(f.label)}</div><div class="iw">
        <select class="inp" data-k="${f.k}">${(f.options || []).map(o => `<option value="${typeof o === 'object' ? o.v : o}" ${((typeof o === 'object' ? o.v : o) == v[f.k]) ? 'selected' : ''}>${esc(typeof o === 'object' ? o.l : o)}</option>`).join('')}</select></div></div>`;
    } else {
      html += `<div class="field"><div class="fl">${esc(f.label)}</div><div class="iw">
        <input class="inp" type="number" data-k="${f.k}" value="${v[f.k]}" step="${f.step || 'any'}" ${f.min !== undefined ? `min="${f.min}"` : ''} ${f.max !== undefined ? `max="${f.max}"` : ''}>
        <span class="unit">${esc(f.unit || '')}</span></div></div>`;
    }
    if (f.hint) html += `<div class="hint" style="grid-column:1/-1">${esc(f.hint)}</div>`;
  });
  if (lastGroup !== null) html += '</div>';
  form.innerHTML = html;

  form.addEventListener('input', e => {
    const el = e.target.closest('.inp');
    if (!el) return;
    const k = el.dataset.k;
    let val = el.value;
    if (el.tagName === 'SELECT') {
      const f = t.inputs.find(x => x.k === k);
      const o = (f.options || []).find(x => String(typeof x === 'object' ? x.v : x) === val);
      val = o && typeof o === 'object' && typeof o.v === 'number' ? o.v : Number(val);
      if (!isFinite(val)) val = o && o.v;
    } else {
      val = parseFloat(val);
      if (!isFinite(val)) return;
    }
    CURV[k] = val;
    setValue(t, k, val);
    updateDynamic(t, CURV);
  });
}

/* 单个字段 HTML（DCDC 分块表单复用） */
function fieldHtml(f, v) {
  if (f.derived) {
    return `<div class="field"><div class="fl">${esc(f.label)}</div><div class="iw"><div class="derived" id="dv_${f.k}">—</div></div></div>`;
  }
  if (f.type === 'select') {
    return `<div class="field"><div class="fl">${esc(f.label)}</div><div class="iw">
      <select class="inp" data-k="${f.k}">${(f.options || []).map(o => `<option value="${typeof o === 'object' ? o.v : o}" ${((typeof o === 'object' ? o.v : o) == v[f.k]) ? 'selected' : ''}>${esc(typeof o === 'object' ? o.l : o)}</option>`).join('')}</select></div></div>`;
  }
  return `<div class="field"><div class="fl">${esc(f.label)}</div><div class="iw">
    <input class="inp" type="number" data-k="${f.k}" value="${v[f.k]}" step="${f.step || 'any'}" ${f.min !== undefined ? `min="${f.min}"` : ''} ${f.max !== undefined ? `max="${f.max}"` : ''}>
    <span class="unit">${esc(f.unit || '')}</span></div></div>`;
}

/* DCDC：设计目标 / 实际选型 分块表单 */
function renderDcdcForm(t, v) {
  const goal = document.getElementById('formGoal');
  const sel = document.getElementById('formSel');
  const groupNames = [];
  (t.inputs || []).forEach(f => { if (!groupNames.includes(f.group)) groupNames.push(f.group); });
  const cleanTitle = g => g.replace(/^[①②③]\s*/, '').replace(/（.*?）/g, '').trim();
  const renderGroup = g => {
    const fs = t.inputs.filter(f => f.group === g);
    let h = `<div class="fgroup"><h5>${esc(cleanTitle(g))}</h5>`;
    fs.forEach(f => {
      h += fieldHtml(f, v);
      if (f.hint) h += `<div class="hint" style="grid-column:1/-1">${esc(f.hint)}</div>`;
    });
    return h + '</div>';
  };
  goal.innerHTML = groupNames.filter(g => g.indexOf('①') === 0).map(renderGroup).join('');
  sel.innerHTML = groupNames.filter(g => g.indexOf('①') !== 0).map(renderGroup).join('');
  [goal, sel].forEach(container => container.addEventListener('input', e => {
    const el = e.target.closest('.inp');
    if (!el) return;
    const val = parseFloat(el.value);
    if (!isFinite(val)) return;
    CURV[el.dataset.k] = val;
    setValue(t, el.dataset.k, val);
    updateDynamic(t, CURV);
  }));
}

function updateDynamic(t, v) {
  const r = t.calc ? t.calc(v) : {};
  CURR = r;
  /* 派生字段 */
  (t.inputs || []).forEach(f => {
    if (!f.derived) return;
    const el = document.getElementById('dv_' + f.k);
    if (el) el.innerHTML = f.derived(v, r);
  });
  /* KPI */
  const kp = document.getElementById('kpis');
  if (kp && t.kpis) {
    const list = t.kpis(v, r) || [];
    kp.innerHTML = list.map(k => `<div class="kpi ${k.cls || ''}"><div class="k"><span>${esc(k.k)}</span>${k.badge ? `<span class="badge-s b-${k.badge[0]}">${esc(k.badge[1])}</span>` : ''}</div>
      <div class="v">${k.raw !== undefined ? k.raw : num(k.v)}<span class="u">${esc(k.unit || '')}</span></div>
      <div class="h">${esc(k.hint || '')}</div></div>`).join('');
  }
  /* 原理图（重渲染时保持图内输入框焦点与光标位置） */
  const sch = document.getElementById('sch');
  if (sch) {
    const af = document.activeElement;
    let fk = null, ss = null, se = null;
    if (af && af.closest && af.closest('#sch') && af.classList.contains('sch-inp')) {
      fk = af.dataset.k;
      try { ss = af.selectionStart; se = af.selectionEnd; } catch (e) {}
    }
    sch.innerHTML = t.sch ? t.sch(v, r) : '<div class="empty" style="padding:24px">该工具以查表 / 计算为主，无电路示意</div>';
    if (fk) {
      const ne = sch.querySelector('.sch-inp[data-k="' + fk + '"]');
      if (ne) {
        ne.focus({ preventScroll: true });
        if (ss !== null && se !== null) { try { ne.setSelectionRange(ss, se); } catch (e) {} }
      }
    }
  }
  /* 结果 */
  const rowsHtml = items => (items || []).map(it => {
    let val;
    if (it.f) val = it.f(v, r); else val = r[it.k];
    let txt;
    if (it.text) txt = it.text(v, r);
    else if (typeof val === 'string') txt = val;
    else txt = num(val, it.d === undefined ? undefined : it.d);
    const cls = (it.key ? ' key' : '') + (it.cls || '');
    const badge = it.badge ? `<span class="badge-s b-${it.badge[0]}">${esc(it.badge[1])}</span>` : '';
    return `<div class="rrow${cls}"><div class="rl">${esc(it.label)}${badge}${it.sub ? `<span class="sub">${esc(it.sub)}</span>` : ''}</div>
      <div class="rv">${esc(txt)}<span class="ru">${esc(it.unit || '')}</span></div></div>`;
  }).join('');
  const sec = (typeof t.outputs === 'function') ? (t.outputs(v, r) || []) : (t.outputs || []);
  const res = document.getElementById('res');
  if (res) {
    res.innerHTML = sec.map(s => `<div class="rsection"><h6>${esc(s.section)}</h6>${rowsHtml(s.items)}</div>`).join('');
  }
  const resTh = document.getElementById('resTh');
  const resAct = document.getElementById('resAct');
  if (resTh && resAct) {
    resTh.innerHTML = `<div class="rsection">${rowsHtml(sec[0] && sec[0].items)}</div>`;
    resAct.innerHTML = `<div class="rsection">${rowsHtml(sec[1] && sec[1].items)}</div>`;
  }
  const rn = document.getElementById('resNote');
  if (rn) rn.textContent = t.resNote || '';
  /* 提示 */
  const nt = document.getElementById('notes');
  if (nt) {
    const list = t.notes ? t.notes(v, r) : [];
    nt.innerHTML = list.map(n => `<div class="note ${n.l || ''}"><i>${n.l === 'err' ? '!' : n.l === 'warn' ? '!' : n.l === 'ok' ? '✓' : 'i'}</i><span>${n.t}</span></div>`).join('') || '<div class="empty">无</div>';
  }
  /* 公式说明 */
  const fm = document.getElementById('formula');
  if (fm) fm.innerHTML = t.formula ? t.formula(v, r) : '<div class="empty">—</div>';
  /* 波形 */
  const wc = document.getElementById('waveCard');
  const cv = document.getElementById('wave');
  const wspec = t.wave ? t.wave(v, r) : null;
  if (wc) {
    const sw = document.getElementById('schWave');
    if (sw) sw.classList.toggle('single', !wspec);
    if (!wspec) { wc.style.display = 'none'; }
    else {
      wc.style.display = '';
      const note = document.getElementById('waveNote');
      if (note) note.textContent = wspec.note || '';
      const lg = document.getElementById('legend');
      if (lg) lg.innerHTML = (wspec.legend || []).map((l, i) => {
        const bg = l.dash
          ? `repeating-linear-gradient(90deg,${l.color} 0 5px,transparent 5px 9px)`
          : (l.color || WCOL[i]);
        return `<span><i style="background:${bg}"></i>${esc(l.t)}</span>`;
      }).join('');
      if (cv) {
        if (wspec.v2) {
          cv.style.height = wspec.height + 'px';
          cv.height = wspec.height;
          const chartSpec = Object.assign({ xmin: 0, xmax: r.T * 2 * 1e6, xunit: 'µs' }, wspec.spec);
          requestAnimationFrame(() => drawChart(cv, chartSpec));
        } else {
          cv.style.height = (wspec.height || (wspec.panels.length * 92 + 28)) + 'px';
          cv.height = cv.style.height;
          requestAnimationFrame(() => drawWaves(cv, wspec));
        }
      }
    }
  }
  /* 表格 */
  const tb = document.getElementById('tbl');
  const tbc = document.getElementById('tblCard');
  const ts = t.table ? t.table(v, r) : null;
  if (tbc) {
    if (!ts) tbc.style.display = 'none';
    else {
      tbc.style.display = '';
      document.getElementById('tblTitle').textContent = ts.title || '明细';
      document.getElementById('tblNote').textContent = ts.note || '';
      tb.innerHTML = `<table class="tbl"><thead><tr>${ts.head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>
        ${ts.rows.map(row => `<tr>${row.map((c, i) => `<td class="${(ts.hit && ts.hit(row, i)) ? 'hit' : ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    }
  }
  /* 同步下方表单显示值（图内编辑时保持双向一致；不重渲染以免打断焦点） */
  ['form','formGoal','formSel'].forEach(cid=>{
    const formEl=document.getElementById(cid);
    if(!formEl)return;
    formEl.querySelectorAll('input.inp,select.inp').forEach(inp=>{
      const k=inp.dataset.k;
      if(inp.tagName==='SELECT'){
        if(inp.value!==String(v[k]))inp.value=String(v[k]);
      }else if(document.activeElement!==inp){
        if(inp.value!==String(v[k]))inp.value=v[k];
      }
    });
  });
}

const E24 = [1.0, 1.1, 1.2, 1.3, 1.5, 1.6, 1.8, 2.0, 2.2, 2.4, 2.7, 3.0, 3.3, 3.6, 3.9, 4.3, 4.7, 5.1, 5.6, 6.2, 6.8, 7.5, 8.2, 9.1];
const E12 = [1.0, 1.2, 1.5, 1.8, 2.2, 2.7, 3.3, 3.9, 4.7, 5.6, 6.8, 8.2];

function nearestSeries(val, series) {
  if (!isFinite(val) || val <= 0) return [];
  const out = [];
  for (let d = -3; d <= 4; d++) {
    series.forEach(s => {
      const x = +(s * Math.pow(10, d)).toPrecision(3);
      out.push(x);
    });
  }
  out.sort((a, b) => a - b);
  const idx = out.findIndex(x => x >= val);
  const pick = [];
  if (idx > 0) pick.push(out[idx - 1]);
  if (idx >= 0 && out[idx] !== pick[0]) pick.push(out[idx]);
  if (pick.length < 2 && idx + 1 < out.length) pick.push(out[idx + 1]);
  return pick.slice(0, 2);
}

/* ---------- SVG 元件库 G：完整连线、标准符号 ---------- */
const G={
  wire(pts,cls){return `<path class="wire ${cls||''}" d="M${pts.map(p=>p.join(',')).join(' L')}"/>`;},
  node(x,y){return `<circle class="node vnode" cx="${x}" cy="${y}" r="3.6"/>`;},
  txt(x,y,t,cls,anchor){return `<text class="${cls||'lbl-b'}" x="${x}" y="${y}" text-anchor="${anchor||'middle'}">${esc(t)}</text>`;},
  tag(x,y,t,anchor){return `<text class="tag" x="${x}" y="${y}" text-anchor="${anchor||'middle'}">${esc(t)}</text>`;},
  badge(x,y,text,k,w){
    const ww=w||Math.max(46,String(text).length*7.2+14);
    return `<g class="vbadge"${k?` data-focus="${k}"`:''}><rect x="${x-ww/2}" y="${y-11}" width="${ww}" height="22"/><text x="${x}" y="${y+4}" text-anchor="middle">${esc(text)}</text></g>`;
  },
  /* 图内可编辑输入：foreignObject + HTML 输入框，中心 (x,y)，unit 为单位后缀 */
  inp(x,y,w,k,val,label,unit){
    const u=unit?`<i class="sch-unit">${esc(unit)}</i>`:'';
    const inner=label
      ?`<div xmlns="http://www.w3.org/1999/xhtml" class="sch-field"><span>${esc(label)}</span><input class="inp sch-inp" type="text" inputmode="decimal" data-k="${k}" value="${val}"/>${u}</div>`
      :`<div xmlns="http://www.w3.org/1999/xhtml" class="sch-unit-wrap"><input class="inp sch-inp" type="text" inputmode="decimal" data-k="${k}" value="${val}"/>${u}</div>`;
    return `<foreignObject class="sch-fo" x="${x-w/2}" y="${y-13}" width="${w}" height="26">${inner}</foreignObject>`;
  },
  /* 图内只读计算徽标：kind ∈ th(理论)/act(实际)/plain */
  calc(x,y,w,text,kind){
    return `<g class="vcalc c-${kind||'plain'}"><rect x="${x-w/2}" y="${y-11}" width="${w}" height="22" rx="5"/><text x="${x}" y="${y+4}" text-anchor="middle">${esc(text)}</text></g>`;
  },
  annL(x,y,t,anchor){return `<text class="ann-l" x="${x}" y="${y}" text-anchor="${anchor||'middle'}">${esc(t)}</text>`;},
  box(x,y,w,h,label,sub){
    return `<rect class="comp-fill" x="${x}" y="${y}" width="${w}" height="${h}" rx="5"/>
      <text class="lbl-b" x="${x+w/2}" y="${y+h/2+(sub?-2:5)}" text-anchor="middle">${esc(label)}</text>
      ${sub?`<text class="lbl" x="${x+w/2}" y="${y+h/2+13}" text-anchor="middle">${esc(sub)}</text>`:''}`;
  },
  gnd(x,y){
    return `<path class="wire" d="M${x},${y} L${x},${y+8}"/><path class="comp" d="M${x-12},${y+8} L${x+12},${y+8} M${x-8},${y+14} L${x+8},${y+14} M${x-4},${y+20} L${x+4},${y+20}"/>`;
  },
  /* 标注渲染：ann={inp:k,val,unit} 可输入；ann={txt,kind} 只读；null 不渲染 */
  _ann(x,y,w,ann){
    if(!ann)return '';
    return ann.inp?this.inp(x,y,w,ann.inp,ann.val,ann.label,ann.unit):this.calc(x,y,w,ann.txt,ann.kind);
  },
  source(x,y,label,ann,plusTop){
    let s=`<circle class="comp-fill" cx="${x}" cy="${y}" r="19"/>`;
    if(plusTop){
      s+=`<path class="wire thin" d="M${x-6},${y-7} L${x+6},${y-7} M${x},${y-12} L${x},${y-2}"/>`;
      s+=`<path class="wire thin" d="M${x-6},${y+7} L${x+6},${y+7}"/>`;
    }
    s+=this.txt(x,y-28,label,'lbl-b');
    s+=this._ann(x+48,y+14,64,ann);
    return s;
  },
  indH(x1,x2,y,label,ann){
    const lead=12,n=4,span=x2-x1-2*lead,r=span/(2*n);
    let d=`M${x1},${y} L${x1+lead},${y}`;
    for(let i=0;i<n;i++){
      const a=x1+lead+2*r*i;
      d+=` A${r},${r} 0 0 1 ${a+2*r},${y}`;
    }
    d+=` L${x2},${y}`;
    let s=`<path class="comp" d="${d}"/>`;
    s+=this.txt((x1+x2)/2,y-r-8,label,'lbl-b');
    s+=this._ann((x1+x2)/2,y+26,66,ann);
    return s;
  },
  indV(x,y1,y2,label,ann){
    const lead=12,n=4,span=y2-y1-2*lead,r=span/(2*n);
    let d=`M${x},${y1} L${x},${y1+lead}`;
    for(let i=0;i<n;i++){
      const a=y1+lead+2*r*i;
      d+=` A${r},${r} 0 0 1 ${x},${a+2*r}`;
    }
    d+=` L${x},${y2}`;
    let s=`<path class="comp" d="${d}"/>`;
    s+=this.txt(x-16,(y1+y2)/2,label,'lbl-b','end');
    s+=this._ann(x+34,(y1+y2)/2,62,ann);
    return s;
  },
  capV(x,y1,y2,label,ann,opts){
    const cy=(y1+y2)/2;
    let s=`<path class="wire" d="M${x},${y1} L${x},${cy-6} M${x},${cy+6} L${x},${y2}"/>`;
    s+=`<path class="comp" d="M${x-13},${cy-6} L${x+13},${cy-6} M${x-13},${cy+6} L${x+13},${cy+6}"/>`;
    s+=this.txt(x-18,cy+3,label,'lbl-b','end');
    if(opts&&opts.annRight) s+=this._ann(x+44,cy,66,ann);
    else s+=this._ann(x,y2+30,66,ann);

  },
  resV(x,y1,y2,label,ann,opts){
    const lead=12,cy=(y1+y2)/2,bodyH=Math.min(48,Math.abs(y2-y1)-2*lead);
    const by=cy-bodyH/2,ey=cy+bodyH/2;
    let d=`M${x},${y1} L${x},${by}`;
    for(let i=1;i<=6;i++){
      const yy=by+bodyH*i/6,xx=i%2?x-7:x+7;
      d+=` L${xx},${yy}`;
    }
    d+=` L${x},${ey} L${x},${y2}`;
    let s=`<path class="comp" d="${d}"/>`;
    if(opts&&opts.annLeft){
      s+=this.txt(x+15,cy+3,label,'lbl-b','start');
      s+=this._ann(x-46,cy,62,ann);
    }else{
      s+=this.txt(x-13,cy+3,label,'lbl-b','end');
      s+=this._ann(x+34,cy,62,ann);
    }
    return s;
  },
  resH(x1,x2,y,label,ann){
    const lead=12,cx=(x1+x2)/2,bodyW=Math.min(64,Math.abs(x2-x1)-2*lead);
    const bx=cx-bodyW/2,ex=cx+bodyW/2;
    let d=`M${x1},${y} L${bx},${y}`;
    for(let i=1;i<=6;i++){
      const xx=bx+bodyW*i/6,yy=i%2?y-7:y+7;
      d+=` L${xx},${yy}`;
    }
    d+=` L${ex},${y} L${x2},${y}`;
    let s=`<path class="comp" d="${d}"/>`;
    s+=this.txt(cx,y-14,label,'lbl-b');
    s+=this._ann(cx,y+27,62,ann);
    return s;
  },
  diodeV(x,y1,y2,flip){
    const cy=(y1+y2)/2;
    let s=`<path class="wire" d="M${x},${y1} L${x},${cy-10} M${x},${cy+10} L${x},${y2}"/>`;
    if(!flip){
      s+=`<path class="comp-fill" d="M${x-9},${cy-10} L${x+9},${cy-10} L${x},${cy+4} Z"/>`;
      s+=`<path class="comp" d="M${x-9},${cy+10} L${x+9},${cy+10}"/>`;
    }else{
      s+=`<path class="comp" d="M${x-9},${cy-10} L${x+9},${cy-10}"/>`;
      s+=`<path class="comp-fill" d="M${x-9},${cy+10} L${x+9},${cy+10} L${x},${cy-4} Z"/>`;
    }
    return s;
  },
  diodeH(x1,x2,y,flip){
    const cx=(x1+x2)/2;
    let s=`<path class="wire" d="M${x1},${y} L${cx-10},${y} M${cx+10},${y} L${x2},${y}"/>`;
    if(!flip){
      s+=`<path class="comp-fill" d="M${cx-10},${y-9} L${cx-10},${y+9} L${cx+4},${y} Z"/>`;
      s+=`<path class="comp" d="M${cx+10},${y-9} L${cx+10},${y+9}"/>`;
    }else{
      s+=`<path class="comp" d="M${cx-10},${y-9} L${cx-10},${y+9}"/>`;
      s+=`<path class="comp-fill" d="M${cx+10},${y-9} L${cx+10},${y+9} L${cx-4},${y} Z"/>`;
    }
    return s;
  },
  mosV(x,y){
    /* N-MOS（严格按用户参考）：栅极在左（L 形短栅板+引线），三段沟道在中，D/S 引线向右 90° 弯折，D 上 / S 下；
       接线点 G(x−34,y+3)、D(x+40,y−30)、S(x+40,y+30) */
    let s=``;
    /* 三段沟道（增强型，上下段带外伸 stub） */
    s+=`<path class="comp" d="M${x},${y-16} L${x},${y-8} M${x},${y-5} L${x},${y+5} M${x},${y+8} L${x},${y+16}"/>`;
    /* 栅极短竖板 + 栅线（L 形，引线在板下端） */
    s+=`<path class="comp" d="M${x-14},${y-13} L${x-14},${y+4}"/>`;
    s+=`<path class="wire" d="M${x-34},${y+3} L${x-14},${y+3}"/>`;
    /* D 引线：沟道上段 → 右 → 上 */
    s+=`<path class="wire" d="M${x},${y-11} L${x+40},${y-11} L${x+40},${y-30}"/>`;
    /* S 引线：沟道下段 → 右 → 下 */
    s+=`<path class="wire" d="M${x},${y+11} L${x+40},${y+11} L${x+40},${y+30}"/>`;
    s+=this.txt(x-18,y-18,'Q1','lbl-b','end');
    return s;
  },
  mosHP(x,y){
    /* P-MOS 横置高边开关，严格按用户参考符号：主沟道在 y，上方 ∩ 形架 + 体二极管（阴极竖条 + 三角指向左），
       下方三柱（左源/中沟道带向上箭头/右漏），栅板横置在更下方，栅线从栅板左端向下；
       接线点：源(x-50,y)、漏(x+62,y)、栅(x,y+161) */
    const k=1.4;
    const X=lx=>x+lx*k, Y=ly=>y+ly*k;
    let s=``;
    /* 主沟道（左右两段）+ ∩ 形架 */
    s+=`<path class="comp" d="M${X(-65)},${y} L${X(1)},${y} M${X(30)},${y} L${X(85)},${y}"/>`;
    s+=`<path class="comp" d="M${X(-36)},${y} L${X(-36)},${Y(-29)} L${X(44)},${Y(-29)} L${X(44)},${y}"/>`;
    /* 体二极管：阴极竖条 + 填充三角（指向左） */
    s+=`<path class="comp" d="M${X(-14)},${Y(-38)} L${X(-14)},${Y(-13)}"/>`;
    s+=`<polygon class="comp-fill" points="${X(-11)},${Y(-26)} ${X(20)},${Y(-47)} ${X(20)},${Y(-5)}"/>`;
    /* 中沟道向上箭头 + 竖柱 */
    s+=`<polygon class="comp-fill" points="${x},${y} ${X(-5)},${Y(10)} ${X(5)},${Y(10)}"/>`;
    s+=`<path class="comp" d="M${x},${Y(10)} L${x},${Y(50)}"/>`;
    /* 左右两柱 + 底部三帽 */
    s+=`<path class="comp" d="M${X(-32)},${y} L${X(-32)},${Y(50)} M${X(33)},${y} L${X(33)},${Y(50)}"/>`;
    s+=`<path class="comp" d="M${X(-43)},${Y(52)} L${X(-25)},${Y(52)} M${X(-7)},${Y(52)} L${X(13)},${Y(52)} M${X(28)},${Y(52)} L${X(47)},${Y(52)}"/>`;
    /* 栅板（横置）+ 栅线向下 */
    s+=`<path class="comp" d="M${x},${Y(65)} L${X(23)},${Y(65)}"/>`;
    s+=`<path class="wire" d="M${x},${Y(65)} L${x},${Y(115)}"/>`;
    s+=this.txt(x,y-78,'Q1','lbl-b');
    return s;
  },
  npn(x,y){
    /* NPN：竖直基极条，基极在左，集电极斜向右上，发射极斜向右下且带向外箭头 */
    let s=`<path class="comp" d="M${x},${y-16} L${x},${y+16}"/>`;
    s+=`<path class="comp" d="M${x-20},${y} L${x},${y}"/>`;
    s+=`<path class="comp" d="M${x},${y-10} L${x+20},${y-26}"/>`;
    s+=`<path class="comp" d="M${x},${y+10} L${x+18},${y+24.5}"/>`;
    s+=`<polygon class="comp-fill" points="${x+20},${y+26} ${x+12.7},${y+24.6} ${x+17.1},${y+19.2}"/>`;
    return s;
  },
  capH(x1,x2,y,label,ann){
    const cx=(x1+x2)/2;
    let s=`<path class="wire" d="M${x1},${y} L${cx-6},${y} M${cx+6},${y} L${x2},${y}"/>`;
    s+=`<path class="comp" d="M${cx-6},${y-10} L${cx-6},${y+10} M${cx+6},${y-10} L${cx+6},${y+10}"/>`;
    s+=this.txt(cx,y-15,label,'lbl-b');
    s+=this._ann(cx,y+26,66,ann);
    return s;
  },
  loadV(x,y1,y2,ann){
    let s=this.resV(x,y1,y2,'负载',null);
    s+=this._ann(x,y2+30,62,ann);
    return s;
  }
};

/* ---------- 计算引擎：理论门槛 + 实际反算 ---------- */
const finite=isFinite;
function calcTopo(v,topo){
  const r={};
  const fsw=v.fsw;
  r.fsw=fsw; r.T=1/(fsw*1000);
  let D;
  if(topo==='buck')D=v.Vout/v.Vin;
  else if(topo==='boost')D=1-v.Vin/v.Vout;
  else D=-v.Vout/(v.Vin-v.Vout);
  r.D=D; r.Dvalid=finite(D)&&D>0&&D<1;

  if(!r.Dvalid){
    r.alerts=[{level:'err',msg:topo==='buck'?
      `Buck 要求 Vout 必须小于 Vin（当前 Vin=${num(v.Vin)} V，Vout=${num(v.Vout)} V），请检查设计目标。`:
      topo==='boost'?
      `Boost 要求 Vout 必须大于 Vin（当前 Vin=${num(v.Vin)} V，Vout=${num(v.Vout)} V），请检查设计目标。`:
      `Buck-Boost 要求 Vout 为负值且 |Vout| 与 Vin 不相等（当前 Vin=${num(v.Vin)} V，Vout=${num(v.Vout)} V），请检查设计目标。`}];
    return r;
  }

  const g=v.gamma;
  const ILavg=topo==='buck'?v.Iout:v.Iout/(1-D);
  r.ILavg=ILavg;
  r.ILrms=ILavg*Math.sqrt(1+g*g/12);
  r.IDavg=ILavg*(1-D);
  r.IMOSavg=ILavg*D;
  r.IDrms=ILavg*Math.sqrt((1-D)*(1+g*g/12));
  r.IMOSrms=ILavg*Math.sqrt(D*(1+g*g/12));

  const dILth=g*ILavg;
  r.dILth=dILth;
  if(topo==='buck')r.Lmin=v.Vout*(1-v.Vout/v.Vin)/(fsw*dILth)*1000;
  else if(topo==='boost')r.Lmin=v.Vin*(1-v.Vin/v.Vout)/(fsw*dILth)*1000;
  else r.Lmin=(v.Vin*v.Vout/(v.Vout-v.Vin))/(fsw*dILth)*1000;
  r.Isatth=ILavg+dILth/2;

  let C1;
  if(topo==='buck')C1=dILth/(8*fsw*v.Vripple)*1e6;
  else C1=v.Iout*D/(fsw*v.Vripple)*1e6;
  const C2=(v.n*v.dIout)/(fsw*v.Vripple)*1e6;
  r.C1=C1; r.C2=C2; r.Cmin=Math.max(C1,C2);
  r.Vcap=Math.abs(v.Vout)*2;
  r.ESRth=topo==='buck'?v.Vripple*0.1/dILth:v.Vripple*0.1/r.Isatth;

  r.Vr=topo==='buck'?v.Vin:topo==='boost'?v.Vout:v.Vin-v.Vout;
  r.Io=r.IDavg;
  r.VDS=topo==='buck'?v.Vin+v.Vf/1000:topo==='boost'?v.Vout+v.Vf/1000:v.Vin+v.Vf/1000-v.Vout;
  r.IDmos=r.Isatth;

  let dILact;
  if(topo==='buck')dILact=v.Vout*(1-D)/(fsw*v.L)*1000;
  else dILact=v.Vin*D/(fsw*v.L)*1000;
  r.dILact=dILact;
  r.gammaAct=dILact/ILavg;
  r.Isatact=ILavg+dILact/2;
  r.ESRact=topo==='buck'?v.Vripple*0.1/dILact:v.Vripple*0.1/r.Isatact;

  if(Math.abs(dILact/2-ILavg)<1e-9)r.mode='BCM';
  else if(dILact/2<ILavg)r.mode='CCM';
  else r.mode='DCM';

  let VrpSw, VrpTr=v.n*v.dIout/(v.Cout*fsw)*1e6;
  if(topo==='buck')VrpSw=dILact/(8*fsw*v.Cout)*1e6;
  else VrpSw=v.Iout*D/(fsw*v.Cout)*1e6;
  r.VrpSw=VrpSw; r.VrpTr=VrpTr;
  r.VrippleAct=Math.max(VrpSw,VrpTr);

  r.PL=r.ILrms*r.ILrms*v.DCR;
  r.Pdiode=v.Vf*r.IDavg;
  r.Pcond=r.IMOSrms*r.IMOSrms*v.RDSon;
  r.Psw=0.5*r.VDS*ILavg*(v.ton+v.toff)*fsw/1000;
  r.Pmos=r.Pcond+r.Psw;
  r.Ptotal=r.PL+r.Pdiode+r.Pmos;

  if(topo!=='buckboost'){
    r.R2max=(v.VFB/(100*v.IFB))*1000;
    const k=Math.abs(v.Vout)/(v.VFB/1000)-1;
    r.R1th=r.R2max*k;
    r.R1set=v.R2set*k;
  }

  const A=[];
  if(v.L<r.Lmin)A.push({level:'err',msg:`电感量 ${num(v.L)} µH 低于理论下限 ${num(r.Lmin)} µH，峰值电流与纹波都会超出设计值，请重新选取。`});
  if(v.Cout<r.Cmin)A.push({level:'err',msg:`输出电容 ${num(v.Cout)} µF 低于理论下限 ${num(r.Cmin)} µF，实际纹波将达到 ${num(r.VrippleAct)} mV（目标 ${num(v.Vripple)} mV）。`});
  if(r.VrippleAct>2*v.Vripple)A.push({level:'err',msg:`实际纹波 ${num(r.VrippleAct)} mV 超过目标 ${num(v.Vripple)} mV 的 2 倍，选型明显不合适。`});
  else if(r.VrippleAct>v.Vripple)A.push({level:'warn',msg:`实际纹波 ${num(r.VrippleAct)} mV 略超目标 ${num(v.Vripple)} mV，建议加大 Cout 或降低 ESR。`});

  if(r.mode==='DCM')A.push({level:'warn',msg:`△iL/2 = ${num(dILact/2)} A 已大于电感平均电流 ${num(ILavg)} A，实际进入 DCM 断续模式，纹波与峰值电流更大。`});
  else if(r.mode==='BCM')A.push({level:'warn',msg:`电感电流恰好回落至零，工作在 BCM 临界模式，负载稍减即进入 DCM。`});
  if(r.gammaAct>0.5)A.push({level:'warn',msg:`实际纹波率 γ = ${pct(r.gammaAct)} 已超过 0.5，电感纹波偏大。`});
  if(g<0.3||g>0.5)A.push({level:'warn',msg:`设计纹波率 γ 一般取 0.3~0.5，当前为 ${num(g)}；γ 太小电感体积大，太大则峰值电流与纹波上升。`});
  if(topo!=='buckboost'&&v.R2set>r.R2max)A.push({level:'warn',msg:`R2 设定 ${num(v.R2set)} kΩ 超过上限 ${num(r.R2max)} kΩ，反馈支路电流不足 IFB 的 100 倍，输出精度会受影响。`});

  A.push({level:'info',msg:`实际峰值电流 ${num(r.Isatact)} A：选电感时饱和电流 Isat 建议留 20% 以上余量，即 ≥ ${num(r.Isatact*1.2)} A；额定电流需 ≥ ${num(r.ILrms)} A。`});
  A.push({level:'info',msg:`考虑电容公差与直流偏压衰减，Cout 建议取理论下限的 1.5~2 倍，即 ${num(r.Cmin*1.5)}~${num(r.Cmin*2)} µF；耐压需 ≥ ${num(r.Vcap)} V，ESR 需 ≤ ${num(r.ESRact)} mΩ。`});
  if(v.L>3*r.Lmin)A.push({level:'info',msg:`电感量 ${num(v.L)} µH 已超过理论下限 3 倍，纹波更小但体积、成本与 DCR 损耗上升，瞬态响应变慢。`});
  if(topo!=='buckboost')A.push({level:'info',msg:`反馈：R2 ≤ ${num(r.R2max)} kΩ 时 R1 理论值 ${num(r.R1th)} kΩ；按 R2=${num(v.R2set)} kΩ 对应 R1 = ${num(r.R1set)} kΩ，实际电阻按 E96 就近取值。`});
  A.push({level:'info',msg:`MOS 开关损耗按 0.5·VDS·IL·(ton+toff)·fSW 估算，若实际驱动较慢或 VDS 振铃明显，需额外留余量。`});

  const hasErr=A.some(a=>a.level==='err'),hasWarn=A.some(a=>a.level==='warn');
  if(!hasErr&&!hasWarn)A.unshift({level:'ok',msg:'当前实际选型满足全部理论门槛，纹波、模式与应力均在设计范围内。'});
  r.alerts=A;
  return r;
}

/* ---------- 波形仿真 ---------- */
const C_TH='#48b9a9', C_ACT='#e8a33d', C_REF='#7f9cb4';
function simOne(topo,v,r,dIL,C_uF){
  const T=r.T,N=480,ILavg=r.ILavg,Iout=v.Iout;
  let VswOn,VswOff;
  if(topo==='buck'){VswOn=v.Vin;VswOff=-v.Vf/1000;}
  else if(topo==='boost'){VswOn=0;VswOff=v.Vout+v.Vf/1000;}
  else {VswOn=0;VswOff=v.Vout-v.Vf/1000;}
  /* DCM：本支路谷值若低于 0，改为从 0 起、回落钳 0 的真实波形 */
  const isDCM=dIL/2>ILavg;
  let Ipk=0,d2=1-r.D;
  if(isDCM){
    Ipk=dIL;                          // 从 0 起，on 段上升量即 dIL
    d2=2*ILavg/Ipk-r.D;               // 下降段占空比，由平均电流恒等式 ILavg=Ipk(D+d2)/2
    if(!(d2>0))d2=1e-6;
  }
  /* 三角纹波幅值（mV），与报表 VrpSw 同一公式 */
  let A;
  if(topo==='buck')A=dIL/(8*v.fsw*C_uF)*1e6;
  else A=Iout*r.D/(v.fsw*C_uF)*1e6;
  const time=[],sw=[],il=[];
  for(let i=0;i<=N;i++){
    const t=i/N*2*T;
    time.push(t*1e6);
    const ph=(t%T)/T,on=ph<r.D;
    let iL;
    if(isDCM){
      if(on){
        iL=Ipk*(ph/r.D);                       // 0 线性上升到 Ipk
      } else {
        const f=(ph-r.D)/d2;
        iL=f>=1?0:Ipk*(1-f);                   // Ipk 线性回落，到 0 后钳位
      }
    } else {
      const frac=on?ph/r.D:(ph-r.D)/(1-r.D);
      iL=on?(ILavg-dIL/2+frac*dIL):(ILavg+dIL/2-frac*dIL);
      if(iL<0)iL=0;
    }
    il.push(iL);
    sw.push(on?VswOn:VswOff);
  }
  /* 电容电流（以"使纹波上升为正"的约定），积分得到纹波，拐点对齐 iL=Iout */
  const ic=[];
  for(let i=0;i<=N;i++){
    const t=i/N*2*T,ph=(t%T)/T,on=ph<r.D;
    let c;
    if(topo==='buck')c=il[i]-Iout;
    else if(topo==='boost')c=on?-Iout:(il[i]-Iout);
    else c=on?Iout:(Iout-il[i]);
    ic.push(c);
  }
  const acc=[0];
  for(let i=1;i<=N;i++)acc[i]=acc[i-1]+(ic[i]+ic[i-1])/2;
  const mean=acc.reduce((a,b)=>a+b,0)/(N+1);
  const raw=acc.map(x=>x-mean);
  const rawPk=Math.max(...raw.map(Math.abs))||1;
  const vo=raw.map(x=>x*A/rawPk);
  return {time,sw,il,vo};
}
function simWaves(v,r,topo){
  if(!r.Dvalid)return null;
  const th=simOne(topo,v,r,r.dILth,r.Cmin);
  const ac=simOne(topo,v,r,r.dILact,v.Cout);
  const time=th.time;
  const pk=a=>Math.max(...a.map(Math.abs));
  return {
    note:`周期 ${num(r.T*1e6,3)} µs · D=${pct(r.D)} · 理论开关纹波 ±${num(pk(th.vo),1)} mV（C=${num(r.Cmin)} µF），实际 ±${num(pk(ac.vo),1)} mV（C=${num(v.Cout)} µF）；虚线为理论计算，实线为实际取值。`,
    legend:[
      {t:'理论计算（Lmin / Cmin）',color:C_TH,dash:true},
      {t:'实际取值（所选 L / Cout）',color:C_ACT,dash:false},
      {t:'目标 / 参考',color:C_REF,dash:true}
    ],
    panels:[
      {title:'VSW  开关节点电压',unit:'V',
        series:[
          {pts:time.map((t,i)=>[t,th.sw[i]]),color:C_TH,dash:true,width:1.5},
          {pts:time.map((t,i)=>[t,ac.sw[i]]),color:C_ACT,dash:false,width:1.8}
        ],
        hlines:[{y:0,label:'0'}]},
      {title:'IL  电感电流',unit:'A',
        series:[
          {pts:time.map((t,i)=>[t,th.il[i]]),color:C_TH,dash:true,width:1.5},
          {pts:time.map((t,i)=>[t,ac.il[i]]),color:C_ACT,dash:false,width:1.8}
        ],
        hlines: topo==='buck'
          ? [{y:v.Iout,color:'#e2726e',include:true,label:'Iout = ILavg '+num(v.Iout,3)}]
          : [
              {y:r.ILavg,label:'ILavg '+num(r.ILavg,3)},
              {y:v.Iout,color:'#e2726e',include:true,label:'Iout '+num(v.Iout,3)}
            ]},
      {title:'ΔVo  输出开关纹波',unit:'mV',
        series:[
          {pts:time.map((t,i)=>[t,th.vo[i]]),color:C_TH,dash:true,width:1.5},

/* ---------- 新 Canvas 绘图引擎（自动量程） ---------- */
const C_GRID='#1d3043';
function drawChart(cv,spec){
  if(!cv||!spec)return;
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth,H=cv.clientHeight;
  if(!W||!H)return;
  cv.width=W*dpr;cv.height=H*dpr;
  const ctx=cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const L=52,Rm=14,Tp=8,Bt=26;
  const n=spec.panels.length;
  const ph=(H-Tp-Bt)/n;
  const x0=spec.xmin,x1=spec.xmax;
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-Rm);

  spec.panels.forEach((p,pi)=>{
    const top=Tp+pi*ph;
    const all=[];
    p.series.forEach(s=>s.pts.forEach(pt=>all.push(pt[1])));
    (p.hlines||[]).forEach(h=>{if(h.include)all.push(h.y);});
    let y0=Math.min(...all),y1=Math.max(...all);
    const pad=(y1-y0)*0.12||Math.abs(y1)*0.1||1;
    const lo=y0-pad,hi=y1+pad;
    const Y=y=>top+15+(hi-y)/(hi-lo)*(ph-30);
    const plotTop=top+15,plotBot=top+ph-15;

    ctx.strokeStyle=C_GRID;ctx.lineWidth=1;ctx.setLineDash([]);
    [0,0.5,1].forEach(f=>{
      const yg=plotTop+f*(plotBot-plotTop);
      ctx.beginPath();ctx.moveTo(L,yg);ctx.lineTo(W-Rm,yg);ctx.stroke();
    });
    if(lo<0&&hi>0){
      ctx.strokeStyle='#33506b';ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.moveTo(L,Y(0));ctx.lineTo(W-Rm,Y(0));ctx.stroke();ctx.setLineDash([]);
    }
    (p.hlines||[]).forEach(h=>{
      const yy=Y(h.y);
      if(yy<plotTop-2||yy>plotBot+2)return;
      ctx.strokeStyle=h.color||C_REF;ctx.setLineDash([4,4]);ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(L,yy);ctx.lineTo(W-Rm,yy);ctx.stroke();ctx.setLineDash([]);
      if(h.label){
        ctx.fillStyle=h.color||C_REF;ctx.font='500 9.5px ui-monospace,monospace';ctx.textAlign='right';
        ctx.fillText(h.label,W-Rm-3,yy-3);
      }
    });
    ctx.save();
    ctx.beginPath();ctx.rect(L,plotTop-4,W-L-Rm,plotBot-plotTop+8);ctx.clip();
    p.series.forEach(s=>{
      ctx.strokeStyle=s.color;ctx.lineWidth=s.width||1.7;
      ctx.setLineDash(s.dash?[6,4]:[]);
      ctx.beginPath();
      s.pts.forEach((pt,j)=>{
        const px=X(pt[0]),py=Y(pt[1]);
        j?ctx.lineTo(px,py):ctx.moveTo(px,py);
      });
      ctx.stroke();ctx.setLineDash([]);
    });
    ctx.restore();
    /* 拐点数值标注 */
    drawKeyLabels(ctx,waveKeyPoints(p.series,x1-x0,lo,hi),X,Y,L,Rm,W,plotTop,plotBot,panelUnit(p));

    ctx.fillStyle='#93b0c6';ctx.font='650 10.5px ui-monospace,monospace';ctx.textAlign='left';
    ctx.fillText(p.title+(p.unit?' ('+p.unit+')':''),L+2,top+10);
    const span=Math.abs(hi-lo);
    const dec=span>=200?0:span>=20?1:span>=2?2:3;
    ctx.fillStyle='#66829b';ctx.font='9.5px ui-monospace,monospace';ctx.textAlign='right';
    ctx.fillText(num(hi,dec),L-5,plotTop+4);
    ctx.fillText(num(lo,dec),L-5,plotBot);
  });

  ctx.strokeStyle=C_GRID;ctx.beginPath();ctx.moveTo(L,H-Bt+3);ctx.lineTo(W-Rm,H-Bt+3);ctx.stroke();
  const ticks=6;
  ctx.fillStyle='#66829b';ctx.font='9.5px ui-monospace,monospace';ctx.textAlign='center';
  for(let i=0;i<=ticks;i++){
    const xv=x0+(x1-x0)*i/ticks;
    const px=X(xv);
    ctx.beginPath();ctx.moveTo(px,H-Bt+1);ctx.lineTo(px,H-Bt+6);ctx.stroke();
    const lab=num(xv,(x1-x0)<30?2:0);
    ctx.fillText(lab,Math.min(Math.max(px,L+8),W-Rm-8),H-Bt+16);
  }
  if(spec.xunit){
    ctx.fillStyle='#88a4ba';ctx.textAlign='right';ctx.font='10px system-ui';
    ctx.fillText(spec.xunit,W-Rm,H-Bt-3);
  }
}

  rows.push(['电感量 L',`≥ ${num(r.Lmin)} µH`,`${num(v.L)} µH`,ok(v.L>=r.Lmin),margin(v.L,r.Lmin)]);
  rows.push(['输出电容 Cout',`≥ ${num(r.Cmin)} µF`,`${num(v.Cout)} µF`,ok(v.Cout>=r.Cmin),margin(v.Cout,r.Cmin)]);
  rows.push(['纹波电压',`≤ ${num(v.Vripple)} mV`,`${num(r.VrippleAct)} mV`,ok(r.VrippleAct<=v.Vripple),margin(v.Vripple,r.VrippleAct)]);
  rows.push(['工作模式','CCM',r.mode,r.mode==='CCM'?'<span class="badge-s b-ok">OK</span>':'<span class="badge-s b-warn">注意</span>','—']);
  rows.push(['电感饱和电流',`≥ ${num(r.Isatact)} A`,'按手册选','<span class="badge-s b-info">核对手册</span>','—']);
  rows.push(['电感额定电流',`≥ ${num(r.ILrms)} A`,'按手册选','<span class="badge-s b-info">核对手册</span>','—']);
  rows.push(['电容耐压',`≥ ${num(r.Vcap)} V`,'按手册选','<span class="badge-s b-info">核对手册</span>','—']);
  rows.push(['电容 ESR',`≤ ${num(r.ESRact)} mΩ`,'按手册选','<span class="badge-s b-info">核对手册</span>','—']);
  rows.push(['二极管反向耐压',`≥ ${num(r.Vr)} V`,'按手册选','<span class="badge-s b-info">核对手册</span>','—']);
  rows.push(['二极管平均电流',`≥ ${num(r.Io)} A`,'按手册选','<span class="badge-s b-info">核对手册</span>','—']);
  rows.push(['MOS 漏源电压',`≥ ${num(r.VDS)} V`,'按手册选','<span class="badge-s b-info">核对手册</span>','—']);
  rows.push(['MOS 漏极电流',`≥ ${num(r.IDmos)} A`,'按手册选','<span class="badge-s b-info">核对手册</span>','—']);
  if(CUR.hasFb)rows.push(['反馈 R2',`≤ ${num(r.R2max)} kΩ`,`${num(v.R2set)} kΩ`,ok(v.R2set<=r.R2max),margin(r.R2max,v.R2set)]);
  return {
    head:['项目','设计要求','你的取值 / 手册','判定','余量'],rows,
    hit:row=>row[3].indexOf('b-err')>=0,
    note:'理论下限与实际取值逐项校核；标注「按手册选」的项目请对照所选器件数据手册的额定值，同样建议留 20% 以上余量。'
  };
}
function dcdcTable(v,r){
  const t=dcdcCheckRows(v,r);
  return {title:'选型校核与标准值',note:t.note,head:t.head,rows:t.rows,hit:(row)=>t.hit(row)};
}

/* ====================== 复位 / 分压 / 滤波 / 软启动 / ADC ====================== */
function expCurve(tau, tmax, vcc, n) {
  const pts = [];
  for (let i = 0; i <= (n || 200); i++) {
    const t = tmax * i / (n || 200);
    pts.push([t, vcc * (1 - Math.exp(-t / tau))]);
  }
  return pts;
}

/* ---------- 电阻分压 ---------- */
tool({
  id: 'divider', group: '复位与滤波', name: '电阻串联分压', kw: '分压 电阻 divider adc 采样',
  sub: '给定 VCC / VEE 与 R1、R2 求输出；或给定目标电压反算阻值',
  icon: '<path d="M8 3v10M5 6h6"/>',
  inputs: [
    { group: '分压网络', k: 'VCC', label: '上端电压 VCC', unit: 'V', def: 10, step: 0.1 },
    { group: '分压网络', k: 'VEE', label: '下端电压 VEE', unit: 'V', def: 0, step: 0.1 },
    { group: '分压网络', k: 'R1', label: '上电阻 R1', unit: 'kΩ', def: 5, step: 0.1 },
    { group: '分压网络', k: 'R2', label: '下电阻 R2', unit: 'kΩ', def: 4.3, step: 0.1 },
    { group: '设计目标', k: 'Vreq', label: '需求输出电压', unit: 'V', def: 4, step: 0.1 }
  ],
  calc: v => {
    const R = {};
    R.Vout = (v.R2 / (v.R1 + v.R2)) * (v.VCC - v.VEE) + v.VEE;
    R.R1req = (v.VCC - v.Vreq) / (v.Vreq - v.VEE) * v.R2;
    R.R2req = (v.Vreq - v.VEE) / (v.VCC - v.Vreq) * v.R1;
    R.Itot = (v.VCC - v.VEE) / ((v.R1 + v.R2) * 1000) * 1000;  // µA
    R.err = R.Vout - v.Vreq;
    R.e1 = nearestSeries(R.R1req, E24); R.e2 = nearestSeries(R.R2req, E24);
    return R;
  },
  kpis: (v, r) => [
    { k: '实际输出', v: r.Vout, unit: 'V', hint: `需求 ${v.Vreq} V`, cls: Math.abs(r.err) < v.Vreq * 0.02 ? 'good' : 'bad' },
    { k: '反算 R1', v: r.R1req, unit: 'kΩ', hint: `当前 R1 = ${v.R1} kΩ` },
    { k: '反算 R2', v: r.R2req, unit: 'kΩ', hint: `当前 R2 = ${v.R2} kΩ` },
    { k: '分压电流', v: r.Itot, unit: 'µA', hint: '静态功耗评估' }
  ],
  outputs: (v, r) => [{
    section: '结果', items: [
      { k: 'Vout', label: '输出电压 Vout', unit: 'V', key: true, d: 4 },
      { label: '与需求偏差', unit: 'mV', text: () => num(r.err * 1000, 2) },
      { k: 'R1req', label: '反算 R1（保持 R2）', unit: 'kΩ', d: 4 },
      { k: 'R2req', label: '反算 R2（保持 R1）', unit: 'kΩ', d: 4 },
      { k: 'Itot', label: '分压支路电流', unit: 'µA', d: 3 },
      { label: 'E24 就近取 R1', text: () => r.e1.join(' / '), unit: 'kΩ' },
      { label: 'E24 就近取 R2', text: () => r.e2.join(' / '), unit: 'kΩ' }
    ]
  }],
  notes: (v, r) => {
    const n = [];
    if (v.VCC <= v.VEE) n.push({ l: 'err', t: 'VCC 必须高于 VEE。' });
    if (v.Vreq >= v.VCC || v.Vreq <= v.VEE) n.push({ l: 'warn', t: '需求电压超出分压范围，无法只靠 R1/R2 实现。' });

      const t = tmax * i / N;
      vin.push([t, t < trIn ? v.VCC * t / trIn : v.VCC]);
      let vo = 0;
      if (t > Ta) { const dt = t - Ta; vo = dt < trOut ? v.VCC * dt / trOut : v.VCC; }
      vout.push([t, vo]);
    }
    return {
      x: { min: 0, max: tmax, unit: 'µs' },
      note: 'VCC in 爬坡 → 延迟到 MOS 开启后 VCC out 输出；竖线为实际软启动时间',

        }
      ]
    };

    R.Vjump = v.CDAC / (v.CDAC + v.CEXT * 1000) * v.Vin * 1000; // mV

    R.Verr0 = v.Vin - R.Vjump / 1000;              // V，初始建立误差

    R.fc = 1 / (2 * Math.PI * R.REXT * (v.CEXT * 1000) * 1e-12); // 外部 RC 滤波：REXT + CEXT

tool({
  id: 'bjt-amp', group: '器件与电路', name: '三极管放大电路', kw: '三极管 bjt 共射 放大 偏置 静态工作点',
  sub: '共射放大：静态工作点、增益分配、偏置电阻与耦合电容',
  icon: '<path d="M8 2v12M4 6l4 2-4 2M8 8h4"/>',
  inputs: [
    { group: '设计目标', k: 'Av', label: '电压放大倍数 Av', unit: '×', def: 5, step: 0.5 },
    { group: '设计目标', k: 'Voutmax', label: '输出最大电压', unit: 'V', def: 5, step: 0.1 },
    { group: '设计目标', k: 'VCC', label: '电源电压 VCC', unit: 'V', def: 15, step: 0.1 },
    { group: '设计目标', k: 'IE', label: '发射极电流 IE', unit: 'mA', def: 100, step: 1, hint: '按频率特性与噪声特性取值' },
    { group: '器件参数', k: 'VBE', label: '基射导通压降 VBE', unit: 'V', def: 0.7, step: 0.05 },
    { group: '器件参数', k: 'beta', label: '电流放大倍数 β', unit: '', def: 100, step: 5, hint: '从规格书取得' },
    { group: '交流参数', k: 'f', label: '信号频率 f', unit: 'Hz', def: 100, step: 10 },
    { group: '交流参数', k: 'RL', label: '负载阻抗 RL', unit: 'kΩ', def: 20, step: 1 }
  ],
  calc: v => {
    const R = {};
    R.IC = v.IE;
    R.VCBO = v.VCC; R.VCEO = v.VCC;
    R.UCE = v.VCC / 2;
    R.RE_RC = (v.VCC - R.UCE) / v.IE;
    R.RC = R.RE_RC * v.Av / (v.Av + 1);
    R.RE = R.RE_RC - R.RC;
    R.PC = R.UCE * R.IC;                       // mW
    R.Ib = v.IE / (1 + v.beta) * 1000;         // µA
    R.Ub = v.IE * R.RE + v.VBE;
    R.Rb2 = R.Ub / (R.Ib * 10) * 1000;         // kΩ
    R.Rb1 = (v.VCC - R.Ub) / (R.Ib + R.Ib * 10) * 1000;
    R.ri = R.Rb1 * R.Rb2 / (R.Rb1 + R.Rb2);
    R.Ci = 1 / (2 * Math.PI * R.ri * v.f) * 1000;   // µF
    R.Co = 1 / (2 * Math.PI * v.RL * v.f) * 1000;
    R.valid = v.Av >= 1 && R.UCE > 0 && v.VCC > R.Ub;
    return R;
  },
  kpis: (v, r) => [
    { k: '静态 UCE', v: r.UCE, unit: 'V', hint: '取 VCC/2 居中' },
    { k: 'RC', v: r.RC, unit: 'kΩ', hint: `RE ${num(r.RE)} kΩ` },
    { k: '偏置 Rb1 / Rb2', raw: `${num(r.Rb1)} / ${num(r.Rb2)}`, unit: 'kΩ', hint: '流过偏置电流 ≈ 11·Ib' },
    { k: '输入阻抗 ri', v: r.ri, unit: 'kΩ', hint: `Ci ${num(r.Ci)} µF` }
  ],
  outputs: (v, r) => [{

      { k: 'VCEO', label: 'VCEO ≥', unit: 'V', d: 1 },
      { k: 'IC', label: '集电极电流 IC ≥', unit: 'mA', d: 1 },
      { k: 'UCE', label: '静态 UCE', unit: 'V', d: 2 },
      { k: 'PC', label: '集电极功耗 PC ≥', unit: 'mW', d: 1 },
      { k: 'Ib', label: '基极电流 Ib', unit: 'µA', d: 2 }
    ]
  }, {
    section: '增益与偏置', items: [
      { k: 'RE_RC', label: 'RE + RC', unit: 'kΩ', d: 4 },
      { k: 'RC', label: 'RC', unit: 'kΩ', d: 4, key: true },
      { k: 'RE', label: 'RE', unit: 'kΩ', d: 4, key: true },
      { k: 'Ub', label: '基极电压 Ub', unit: 'V', d: 3 },
      { k: 'Rb2', label: '下偏置 Rb2', unit: 'kΩ', d: 3 },
      { k: 'Rb1', label: '上偏置 Rb1', unit: 'kΩ', d: 3 }
    ]
  }, {
    section: '耦合电容', items: [
      { k: 'ri', label: '输入阻抗 ri = Rb1∥Rb2', unit: 'kΩ', d: 4 },
      { k: 'Ci', label: '输入耦合电容 Ci', unit: 'µF', d: 4, key: true },
      { k: 'Co', label: '输出耦合电容 Co', unit: 'µF', d: 4 }
    ]
  }],
  notes: (v, r) => {
    const n = [];
    if (v.VCC <= r.Ub) n.push({ l: 'err', t: '基极电压已接近 VCC，偏置无法建立，需降低 IE 或改用分压偏置。' });
    n.push({ l: 'info', t: '静态工作点放在 VCC/2 附近，输出可得到最大对称摆幅，失真最小。' });
    n.push({ l: 'info', t: `偏置支路电流取 Ib 的约 10 倍（${num(r.Ib * 10, 0)} µA），β 离散对工作点影响可压到约 10%。` });
    n.push({ l: 'info', t: '实际增益 Av ≈ RC/RE（有发射极旁路电容时会变化），温度漂移由 RE 负反馈抑制。' });
    n.push({ l: 'info', t: `耦合电容按信号最低频率选取，截止频率 f = 1/(2πRC)，当前 ${v.f} Hz。` });
    return n;
  },
  sch: (v, r) => `<svg class="gsch" viewBox="0 0 920 480" preserveAspectRatio="xMidYMid meet">
    <text class="lbl-b" x="410" y="44">VCC</text>
    ${G.wire([[300, 60], [520, 60]])}
    ${G.resV(300, 60, 270, 'Rb1', {txt:`${num(r.Rb1)} kΩ`,kind:'act'})}
    ${G.resV(520, 60, 230, 'Rc', {txt:`${num(r.RC)} kΩ`,kind:'act'})}
    ${G.node(300,270)}${G.node(520,230)}
    ${G.wire([[300,270],[300,280],[380,280]])}
    ${G.wire([[420,254],[420,230],[520,230]])}
    ${G.npn(400,280)}
    ${G.wire([[420,306],[420,310]])}
    ${G.resV(300, 280, 420, 'Rb2', {txt:`${num(r.Rb2)} kΩ`,kind:'act'})}
    ${G.resV(420, 310, 420, 'Re', {txt:`${num(r.RE)} kΩ`,kind:'act'})}
    ${G.wire([[120,420],[780,420]])}
    ${G.gnd(420,420)}
    <circle cx="60" cy="280" r="5" class="comp"/><circle cx="60" cy="420" r="5" class="comp"/>
    <text class="lbl-b" x="60" y="262">ui</text>
    ${G.capH(140, 300, 280, 'C1', {txt:`${num(r.Ci)} µF`,kind:'act'})}
    ${G.capH(520, 660, 230, 'C2', {txt:`${num(r.Co)} µF`,kind:'act'})}
    ${G.wire([[660,230],[720,230]])}
    ${G.resV(720, 230, 420, 'RL', {inp:'RL',val:v.RL,unit:'kΩ'})}
    ${G.calc(150,250,82,`Ub ${num(r.Ub)} V`,'act')}
    ${G.calc(470,205,86,`UCE ${num(r.UCE)} V`,'act')}
    ${G.tag(700,205,`Av ≈ ${num(v.Av)}×`)}
  </svg>`,
  formula: () => `<div class="mini" style="line-height:1.9">
    UCE = VCC/2；(RE+RC) = (VCC−UCE)/IE；RC = (RE+RC)·Av/(Av+1)；RE = (RE+RC) − RC<br>
    Ib = IE/(1+β)；Ub = IE·RE + VBE；Rb2 = Ub/(10·Ib)；Rb1 = (VCC−Ub)/(11·Ib)<br>
    ri = Rb1∥Rb2；Ci = 1/(2π·ri·f)；Co = 1/(2π·RL·f)
  </div>`
});

tool({
  id: 'bjt-switch', group: '器件与电路', name: '三极管开关电路', kw: '三极管 开关 饱和 驱动 继电器 led',

  inputs: [
    { group: '负载条件', k: 'Vload', label: '负载工作电压', unit: 'V', def: 1.2, step: 0.1 },
    { group: '负载条件', k: 'Iload', label: '负载工作电流', unit: 'mA', def: 5, step: 0.5 },
    { group: '负载条件', k: 'VCEsat', label: '饱和压降 VCE(sat)', unit: 'V', def: 0.5, step: 0.05 },
    { group: '驱动条件', k: 'VCC', label: '电源电压 VCC', unit: 'V', def: 3.3, step: 0.1 },
    { group: '驱动条件', k: 'VIO', label: '控制电平 VIO', unit: 'V', def: 3.3, step: 0.1 },
    { group: '驱动条件', k: 'Ube', label: '基射导通压降 Ube', unit: 'V', def: 1.2, step: 0.05, hint: '从规格书取得' },
    { group: '驱动条件', k: 'beta', label: '电流放大倍数 β', unit: '', def: 100, step: 5 }
  ],
  calc: v => {
    const R = {};
    R.RC = (v.VCC - v.VCEsat - v.Vload) / v.Iload * 1000;   // Ω
    R.Ibmin = v.Iload / v.beta * 3 * 1000;                  // µA
    R.Ibmax = v.Iload / v.beta * 10 * 1000;
    R.RBmax = (v.VIO - v.Ube) / R.Ibmin * 1000;             // kΩ
    R.RBmin = (v.VIO - v.Ube) / R.Ibmax * 1000;
    R.feasible = R.RBmin < R.RBmax && R.RC > 0;
    R.Pload = v.Iload * v.Vload;                             // mW
    R.Prc = v.Iload * v.Iload / 1000 * R.RC;                 // mW
    return R;
  },
  kpis: (v, r) => [
    { k: '限流电阻 RC', v: r.RC, unit: 'Ω', hint: `负载 ${v.Iload} mA / ${v.Vload} V` },

      { k: 'Ibmin', label: '最小基极电流（3×IC/β）', unit: 'µA', d: 1 },
      { k: 'Ibmax', label: '最大基极电流（10×IC/β）', unit: 'µA', d: 1 },
      { k: 'RBmax', label: '基极电阻上限', unit: 'kΩ', key: true, d: 3 },
